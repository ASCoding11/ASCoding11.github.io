<meta property="og:description" content="Colour in every country, state and city you've visited, keep a wishlist, collect 469 pixel-art wonders and compare maps with friends.">
<meta property="og:url" content="https://ascoding11.github.io/where-have-you-been/">

<link rel="stylesheet" href="../site.css">
<link rel="preconnect" href="https://ngcoding10.github.io">
<style>
  /* The app itself lives at APP below (its own repo and Firebase project), so everyone shares one set of
     accounts, friends and data whether they open it here or on its own site. This page only frames it. */
  html, body { height: 100%; }
  body { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .appbar { display: flex; align-items: center; gap: 14px; padding: 8px 14px; padding-top: max(8px, env(safe-area-inset-top));
    padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right));
    border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
  .appbar .wordmark { font-size: 20px; }
  .appbar .back { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
  .appbar .back:hover { color: var(--ink); }
  .appbar .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appbar .btn { padding: 6px 12px; font-size: 14px; white-space: nowrap; }
  .frame { position: relative; flex: 1; min-height: 0; background: #0a1426; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .frame .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #9db0cc; font-family: var(--mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  @media (max-width: 560px) { .appbar .title, .appbar .wordmark { display: none; } .appbar { justify-content: space-between; } }
</style>
</head>
<body>
  <div class="appbar">
    <a class="wordmark" href="../">Arjun</a>
    <a class="back" href="../projects/">← All projects</a>
    <span class="title">Where Have You Been?</span>
    <a class="btn" id="full" href="https://ngcoding10.github.io/wherehaveyoubeen/" target="_blank" rel="noopener">Open full screen ↗</a>
  </div>
  <main class="frame">
    <div class="loading" aria-hidden="true">Loading the map…</div>
    <iframe id="app" title="Where Have You Been? interactive travel map"
      allow="geolocation; clipboard-write; web-share; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <noscript><p style="padding:16px">This map needs JavaScript. <a href="https://ngcoding10.github.io/wherehaveyoubeen/">Open it directly</a>.</p></noscript>
<script>
  // Pass invite links and other parameters through, e.g. /where-have-you-been/?add=username
  (function () {
    var APP = 'https://ngcoding10.github.io/wherehaveyoubeen/';
    var url = APP + location.search + location.hash;
    document.getElementById('app').src = url;
    document.getElementById('full').href = url;
  })();
</script>
<script src="/analytics/tracker.js" data-site="games" defer></script>
</body>
</html>
