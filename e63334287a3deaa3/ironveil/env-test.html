<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Midnight Ops: environment test</title>
<style>
  html, body { margin: 0; height: 100%; background: #050608; overflow: hidden; font: 13px/1.35 system-ui, sans-serif; color: #c9ccd0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: fixed; left: 10px; top: 10px; background: rgba(8,10,12,.72); padding: 8px 10px; border-radius: 6px; max-width: 46vw; }
  #hud select, #hud button { background: #15181c; color: #d8dade; border: 1px solid #2c3036; border-radius: 4px; padding: 3px 6px; margin: 2px 4px 2px 0; font: inherit; }
  #stats { font-variant-numeric: tabular-nums; white-space: pre; margin-top: 6px; color: #9aa3ad; }
  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: #050608; }
  #bar { width: 240px; height: 4px; background: #1a1d21; } #bar i { display: block; height: 100%; width: 0; background: #8a8f96; }
  #help { color: #6f7780; margin-top: 4px; }
  body.shot #hud { display: none; }

<body>
<canvas id="c"></canvas>
<div id="load"><div>Making textures…</div><div id="bar"><i></i></div></div>

  <div id="help">Drag to look, WASD / arrows to fly, Q/E down/up, Shift fast. Touch: drag to look, two fingers to move.</div>
</div>

<script>
(function () {
  'use strict';
  const qs = new URLSearchParams(location.search);
  const quality = qs.get('q') || 'medium', preset = qs.get('preset') || 'night_moon';
  if (qs.get('shot')) document.body.classList.add('shot');
  const E = IVEnv;
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: quality !== 'low', powerPreference: 'high-performance', preserveDrawingBuffer: !!qs.get('shot') });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, quality === 'high' ? 1.5 : 1));
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(68, 1, 0.05, 900);
  E.init(renderer, quality);

  // ---------------------------------------------------------------- the farmyard layout (x east, z south)
  const LANE = [[-120, 70], [-70, 52], [-35, 34], [-10, 14], [8, -6], [22, -30], [30, -60], [34, -110]];
  const STREAM = [[-120, -20], [-80, -12], [-50, -6], [-30, 8], [-22, 40], [-30, 80], [-24, 130]];
  const HEDGES = [ // hedge lines (on banks along the lane, and field boundaries)
    LANE.map(p => [p[0] - 4.2, p[1] - 2.2]), LANE.map(p => [p[0] + 4.2, p[1] + 2.2]),
    [[40, -10], [90, -14], [120, 20]], [[-60, -60], [-20, -48], [10, -40]]
  ];
  const WHEAT = [[40, 0], [100, -6], [104, 50], [44, 56]];
  const YARD = { x: 58, z: -64, r: 22 };
  function segDist(px, pz, pts) {
    let best = 1e9, bt = 0, bi = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const ax = pts[i][0], az = pts[i][1], bx = pts[i + 1][0], bz = pts[i + 1][1], dx = bx - ax, dz = bz - az, l2 = dx * dx + dz * dz;
      let t = ((px - ax) * dx + (pz - az) * dz) / l2; t = Math.max(0, Math.min(1, t));
      const d = Math.hypot(px - ax - dx * t, pz - az - dz * t); if (d < best) { best = d; bt = t; bi = i; }
    }
    return best;
  }
  function inPoly(x, z, P) { let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { if (((P[i][1] > z) !== (P[j][1] > z)) && (x < (P[j][0] - P[i][0]) * (z - P[i][1]) / (P[j][1] - P[i][1]) + P[i][0])) c = !c; } return c; }
  const sm = (a, b, v) => E.sstep(a, b, v);
  function base(x, z) { return 3.2 * E.fbm2(x / 90 + 3, z / 90 + 1, 7, 4) + 0.9 * E.fbm2(x / 23, z / 23, 8, 3) - 2.0 + x * 0.006; }
  function height(x, z) {
    let h = base(x, z);
    const dl = segDist(x, z, LANE);
    // sunken lane: cut 1.3 m with banks; ruts 0.8 m either side of the centre, a crown between them
    h -= 1.3 * (1 - sm(2.4, 4.4, dl));
    h += 0.45 * sm(3.4, 4.2, dl) * (1 - sm(4.2, 6.0, dl));      // the hedge bank
    if (dl < 2.4) { const r = Math.abs(dl - 0.85); h -= 0.09 * (1 - sm(0, 0.3, r)); h += 0.03 * (1 - sm(0, 0.4, dl)); }
    const ds = segDist(x, z, STREAM);
    h -= 1.6 * (1 - sm(0.8, 4.0, ds));
    const dy = Math.hypot(x - YARD.x, z - YARD.z); h = h + (base(YARD.x, YARD.z) + 0.3 - h) * (1 - sm(YARD.r, YARD.r + 14, dy));
    return h;
  }
  const hedgeD = (x, z) => { let d = 1e9; for (const H of HEDGES) d = Math.min(d, segDist(x, z, H)); return d; };
  function surfaceAt(x, z) {
    const dl = segDist(x, z, LANE), ds = segDist(x, z, STREAM);
    if (ds < 1.4) return 'water';
    if (ds < 3.2) return 'tussock';
    if (dl < 0.32) return 'lanemid';
    if (dl < 2.2) return 'lane';
    if (dl < 2.9) return 'verge';
    const dy = Math.hypot(x - YARD.x, z - YARD.z);
    if (dy < YARD.r) return dy > YARD.r - 3 ? 'yardedge' : 'yard';
    if (inPoly(x, z, WHEAT)) return 'field';
    const dh = hedgeD(x, z);
    if (dh < 2.2) return 'tussock';
    if (x < -10 && z < 30) return 'meadow';
    return E.fbm2(x / 30, z / 30, 33, 2) > 0.62 ? 'meadow' : 'grass';
  }
  const longAt = (x, z) => 1 - sm(1.5, 4.0, hedgeD(x, z));

  // ---------------------------------------------------------------- cameras for screenshots
  const CAMS = {
    lane: { p: [-20, 0, 22.5], look: [10, -1.0, -8], eye: 1.65 },
    farm: { p: [-30, 22, 40], look: [40, 0, -40], eye: 0 },
    stand: { p: [-60, 0, -25], look: [-40, 0, -15], eye: 1.65 },
    crouch: { p: [-60, 0, -25], look: [-40, 0, -15], eye: 0.95 },
    prone: { p: [-60, 0, -25], look: [-40, 0, -15], eye: 0.32 },
    clump: { p: [-55.5, 0, -22], look: [-55.0, 0, -21.3], eye: 0.35 },
    edge: { p: [-75, 0, -38], look: [-40, 0, -20], eye: 1.2 },
    lamp: { p: [-8, 0, 17], look: [0, 0, 2], eye: 1.65 },
    walk0: { p: [-100, 0, -40], look: [-50, 0, -40], eye: 1.65 },
    fig10: { p: [-92, 0, 98], look: [-92, 0, 88], eye: 1.65 },
    fig40: { p: [-92, 0, 128], look: [-92, 0, 88], eye: 1.65 },
    dent: { p: [-90, 0, 91], look: [-92, -1.4, 88], eye: 1.9 },
    b_farmhouse: { p: [46, 0, -68], look: [52, 3, -80], eye: 1.7 },
    b_barn: { p: [84, 0, -50], look: [72, 3, -60], eye: 1.7 },
    b_shed: { p: [48, 0, -56], look: [40, 1, -62], eye: 1.7 },
    b_cottage: { p: [26, 0, -84], look: [20, 2.5, -95], eye: 1.7 },
    b_ruin: { p: [72, 0, -84], look: [80, 2, -95], eye: 1.7 },
    b_bunker: { p: [2, 0, -66], look: [8, 1, -58], eye: 1.7 },
    b_church: { p: [92, 0, -96], look: [96, 6, -120], eye: 1.7 },
    b_shoprow: { p: [60, 0, -102], look: [60, 3, -115], eye: 1.7 },
    brick1m: { p: [20.75, 0, -91.0], look: [19.96, -0.45, -91.96], eye: 1.45 },
    brick5m: { p: [22, 0, -87.5], look: [20.5, 1.8, -92.6], eye: 1.7 },
    brick30m: { p: [28, 0, -64], look: [20, 2.2, -95], eye: 1.7 },
    inside: { p: [50.5, 0, -79.5], look: [46, 1.2, -82], eye: 1.65 },
    t_orchard: { p: [44, 0, -106], look: [45, 1.5, -124], eye: 1.7 },
    t_oak: { p: [-20, 0, 38], look: [-30, 4, 30], eye: 1.7 },
    t_ash: { p: [22, 0, 4], look: [12, 5, -2], eye: 1.7 },
    t_poplar: { p: [-12, 0, 62], look: [-27, 8, 70], eye: 1.7 },
    t_pine: { p: [98, 0, -56], look: [114, 5, -70], eye: 1.7 },
    t_dead: { p: [-70, 0, 18], look: [-80, 4, 10], eye: 1.7 },
    t_sapling: { p: [-36, 0, -16], look: [-42, 1.2, -22], eye: 1.7 },
    t_far: { p: [-10, 0, 30], look: [40, 3, -90], eye: 1.7 },
    hedge: { p: [-46, 0, 46], look: [-58, 1, 40], eye: 1.7 },
    wheat: { p: [42, 0, 4], look: [70, 0.5, 30], eye: 1.7 },
    stream: { p: [-36, 0, 2], look: [-27, -1.4, 18], eye: 1.7 },
    yard: { p: [56, 0, -50], look: [64, 1, -72], eye: 1.7 },
    props: { p: [52, 0, -68], look: [44, 0.5, -74], eye: 1.7 },
    wall: { p: [62, 0, -40], look: [76, 0.8, -46], eye: 1.7 },
    decals: { p: [52, 0, -73.5], look: [52, 1.4, -76.24], eye: 1.5 },
    fs_close: { p: [49.5, 0, -75.0], look: [49.5, -0.2, -76.3], eye: 1.4 },
    planks_close: { p: [79.2, 0, -63], look: [77.6, 0.3, -63], eye: 1.9 },
    roof_close: { p: [53, 0, -73], look: [53, 3.6, -78.6], eye: 6.3 },
    inside_barn: { p: [72, 0, -56], look: [72, 1.4, -66], eye: 1.7 },
    door_close: { p: [52.2, 0, -74.9], look: [52.0, -0.3, -76.2], eye: 1.3 },
    ruin_close: { p: [77.5, 0, -88.9], look: [79.5, 0.4, -91.8], eye: 1.6 },
    figlong10: { p: [-70, 0, -30], look: [-60, 0, -30], eye: 1.65 }
  };
  const pitchYaw = { yaw: 0, pitch: 0 };
  function setCam(name) {
    const c = CAMS[name] || CAMS.lane;
    const y = c.eye ? height(c.p[0], c.p[2]) + c.eye : c.p[1];
    camera.position.set(c.p[0], y, c.p[2]);
    const ly = c.eye ? height(c.look[0], c.look[2]) + c.eye * 0.7 + (c.look[1] || 0) : c.look[1];
    camera.lookAt(c.look[0], ly, c.look[2]);
    const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ'); pitchYaw.yaw = e.y; pitchYaw.pitch = e.x;
  }

  // ---------------------------------------------------------------- UI
  const selP = document.getElementById('preset'), selQ = document.getElementById('quality'), selC = document.getElementById('cam');
  Object.keys(E.PRESETS).forEach(n => selP.add(new Option(n, n, n === preset, n === preset)));
  Object.keys(CAMS).forEach(n => selC.add(new Option(n, n))); window.T && (window.T.CAMS = CAMS);
  selQ.value = quality;
  selQ.onchange = () => { qs.set('q', selQ.value); location.search = qs.toString(); };
  selP.onchange = () => { atmo.set(selP.value); };
  selC.onchange = () => setCam(selC.value);
  const bar = document.querySelector('#bar i');

  let atmo, grass, ground, lamps = [], figure;
  E.load((f) => { bar.style.width = (f * 100) + '%'; }).then(() => {
    document.getElementById('load').style.display = 'none';
    atmo = E.atmosphere(scene, renderer, preset, { mistBase: -2.2 });
    ground = E.ground(height, { surfaceAt, x0: -130, z0: -130, x1: 130, z1: 130 });
    scene.add(ground.group);
    window.T.post = IVRender.create(renderer, scene, camera, quality); resize();   // the game's frame pipeline (js/render.js)
    grass = E.grass(surfaceAt, height, { longAt });
    scene.add(grass.group);
    // lamp posts along the lane and in the yard (real props, each with a point light and a glow)
    const addProp = (kind, x, z, rot, seed, opts) => { const p = E.prop(kind, seed || 1, opts); const y = height(x, z); p.group.position.set(x, y, z); p.group.rotation.y = rot || 0; scene.add(p.group);
      for (const l of p.lights) if (l.power > 0) { const c = Math.cos(rot || 0), sn = Math.sin(rot || 0); const L = new THREE.PointLight(l.color, l.power, l.r, 2); L.position.set(x + l.x * c + l.z * sn, y + l.y, z - l.x * sn + l.z * c); scene.add(L); lamps.push(L); }
      return p; };
    window.T.addProp = addProp;
    [[-6, 12, 0.6], [14, -18, 2.2], [48, -64, 0]].forEach(([x, z, r], i) => addProp('lamppost', x, z, r, 40 + i));
    // stand-in person-sized figure (field grey) for readability checks
    figure = new THREE.Group();
    const fm = new THREE.MeshStandardMaterial({ color: new THREE.Color(0x5c6152).convertSRGBToLinear(), roughness: 0.85 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.17, 1.1, 10), fm); body.position.y = 1.05; figure.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), fm); head.position.y = 1.72; figure.add(head);
    const legs = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.12, 0.6, 8), fm); legs.position.y = 0.3; figure.add(legs);
    figure.traverse(o => { o.castShadow = true; });
    figure.position.set(-92, height(-92, 88), 88); scene.add(figure);
    // ---------------------------------------------------------------- buildings
    window.T.buildings = [];
    const place = (spec, x, z, rot) => {
      const b = E.building(spec); const y = height(x, z);
      b.group.position.set(x, y, z); b.group.rotation.y = rot || 0; scene.add(b.group);
      b.group.traverse(o => { if (o.isMesh) { o.matrixAutoUpdate = true; } });
      window.T.buildings.push({ spec, b, x, z, rot });
      // lit windows become lamp-like lights (the game gives them pooled point lights; here a few real ones)
      for (const l of b.lights) if (l.power > 0 && window.T.lampsUsed < 6) { const L = new THREE.PointLight(l.color, l.power * 1.2, l.r, 2); const c = Math.cos(rot || 0), sn = Math.sin(rot || 0); L.position.set(x + l.x * c + l.z * sn, y + l.y, z - l.x * sn + l.z * c); scene.add(L); window.T.lampsUsed++; }
      return b;
    };
    window.T.lampsUsed = 2;
    if (!qs.get('nobuild')) {
      place({ kind: 'farmhouse', w: 12, d: 7.5, floors: 2, seed: 3, damage: 0.15, lit: 0.35 }, 52, -80, 0);
      place({ kind: 'barn', w: 10, d: 16, seed: 4, damage: 0.35, lit: 1 }, 72, -60, -Math.PI / 2);
      place({ kind: 'shed', w: 4, d: 3, seed: 5, damage: 0.2 }, 40, -62, Math.PI / 2);
      place({ kind: 'cottage', w: 8, d: 6, seed: 6, damage: 0.1, lit: 0.5 }, 20, -95, 0.15);
      place({ kind: 'ruin', w: 9, d: 7, seed: 7, damage: 0.8 }, 80, -95, -0.2);
      place({ kind: 'bunker', w: 5, d: 5, seed: 8, damage: 0.5 }, 8, -58, Math.PI * 0.85);
      place({ kind: 'church', w: 16, d: 8, seed: 9, damage: 0.2, lit: 0.2 }, 100, -120, 0.1);
      place({ kind: 'shoprow', units: 3, d: 8, seed: 10, damage: 0.25, lit: 0.4 }, 60, -115, 0);
    }
    if (!qs.get('nonature')) {
      // hedgerows on the lane banks and along field edges, with gaps for gates
      for (let i = 0; i < HEDGES.length; i++) { const h = E.hedge(HEDGES[i], { h: i < 2 ? 2.2 : 2.6, w: 1.7, seed: 30 + i, heightFn: height, gaps: i === 0 ? [[60, 66]] : i === 2 ? [[20, 25]] : [] }); scene.add(h.group); }
      // trees: an orchard behind the farmhouse, hedgerow oaks and ashes, poplars by the stream, pines, a dead tree, saplings
      const trees = [];
      for (let i = 0; i < 6; i++) for (let j = 0; j < 4; j++) trees.push({ kind: 'apple', x: 30 + i * 6 + (j % 2) * 3, y: 0, z: -118 - j * 6, scale: 0.85 + E.hash(i, j, 3) * 0.3 });
      [[-30, 30, 'oak'], [-62, 46, 'oak'], [12, -2, 'ash'], [44, -16, 'oak'], [94, -10, 'ash'], [-50, -52, 'oak'], [-15, -47, 'ash'], [70, 22, 'oak']].forEach(([x, z, k]) => trees.push({ kind: k, x, z }));
      [[-26, 46], [-27, 56], [-25, 68], [-29, 84], [-34, 100]].forEach(([x, z]) => trees.push({ kind: 'poplar', x, z }));
      [[110, -70], [116, -64], [112, -80], [122, -72]].forEach(([x, z]) => trees.push({ kind: 'pine', x, z }));
      trees.push({ kind: 'dead', x: -80, z: 10 }); [[-40, -20], [-44, -25], [64, -30]].forEach(([x, z]) => trees.push({ kind: 'sapling', x, z }));
      // a line-up of every kind in open pasture, for silhouette checks (z = 125, 22 m apart)
      const LK = ['oak', 'ash', 'poplar', 'apple', 'pine', 'dead', 'sapling'];
      LK.forEach((k, i) => { trees.push({ kind: k, x: -110 + i * 22, z: 125, seed: 1 }); CAMS['sil15_' + k] = { p: [-110 + i * 22, 0, 110], look: [-110 + i * 22, 5, 125], eye: 1.7 }; });
      CAMS.sil40 = { p: [-44, 0, 85], look: [-44, 6, 125], eye: 1.7 }; CAMS.sil100 = { p: [-44, 0, 25], look: [-44, 2, 125], eye: 8 };
      CAMS.sil150 = { p: [-44, 0, -25], look: [-44, 0, 125], eye: 11 };
      CAMS.dent_long = { p: [-58, 0, -27], look: [-60, -1.6, -24], eye: 1.8 }; CAMS.dent_top = { p: [-60, 0, -25.6], look: [-60, -2.4, -24.2], eye: 2.6 };
      for (const t of trees) t.y = height(t.x, t.z);
      window.T.trees = E.trees(trees); scene.add(window.T.trees.group);
      // the stream with reeds on its banks
      const st = E.stream(STREAM, { width: 2.6, heightFn: height, waterY: (x, z) => base(x, z) - 1.35 - 0.0 }); scene.add(st.group);
      const near = (pts, a, b) => (x, z) => { const d = segDist(x, z, pts); return d > a && d < b ? 1 : 0; };
      window.T.scat = [
        E.scatter('wheat', (x, z) => inPoly(x, z, WHEAT) ? 1 : 0, { heightFn: height }),
        E.scatter('reeds', near(STREAM, 1.0, 3.0), { heightFn: height }),
        E.scatter('nettles', (x, z) => hedgeD(x, z) < 2.4 && hedgeD(x, z) > 1.0 ? 0.6 : 0, { heightFn: height }),
        E.scatter('brambles', (x, z) => hedgeD(x, z) < 2.2 ? 0.5 : 0, { heightFn: height }),
        E.scatter('ferns', (x, z) => hedgeD(x, z) < 2.6 && E.vnoise(x / 6, z / 6, 4) > 0.5 ? 0.7 : 0, { heightFn: height }),
        E.scatter('dock', (x, z) => surfaceAt(x, z) === 'grass' && E.vnoise(x / 9, z / 9, 5) > 0.7 ? 0.5 : 0, { heightFn: height }),
        E.scatter('flowers', (x, z) => surfaceAt(x, z) === 'meadow' ? 0.4 : 0, { heightFn: height })
      ];
      for (const sc of window.T.scat) scene.add(sc.group);
      for (const [k, b] of [['rocks', [-130, -130, 130, 130]], ['logs', [-80, -80, 120, 40]], ['stumps', [-80, -80, 120, 40]]]) { const o = E.scatter(k, (x, z) => { const s = surfaceAt(x, z); return s === 'grass' || s === 'meadow' || s === 'verge' || s === 'tussock' ? 1 : 0; }, { heightFn: height, bounds: b, seed: k.length }); o.group.name = 'IVEnv.prop:scatter-' + k; scene.add(o.group); }
      { const o = E.scatter('litter', (x, z) => trees.some(t => Math.hypot(t.x - x, t.z - z) < 5) ? 1 : 0, { heightFn: height, bounds: [-90, -130, 130, 110], density: 3 }); o.group.name = 'IVEnv.prop:litter'; scene.add(o.group); }
      { const pud = []; const R = E.rng(9); for (let s = 0; s < 160; s += R.range(4, 12)) { let acc = 0; for (let i = 0; i < LANE.length - 1; i++) { const a = LANE[i], b = LANE[i + 1], L = Math.hypot(b[0] - a[0], b[1] - a[1]); if (acc + L >= s) { const t = (s - acc) / L, x = a[0] + (b[0] - a[0]) * t, z = a[1] + (b[1] - a[1]) * t, dx = (b[0] - a[0]) / L, dz = (b[1] - a[1]) / L, side = R() < 0.5 ? -0.85 : 0.85; pud.push([x - dz * side, height(x - dz * side, z + dx * side), z + dx * side, R.range(0.5, 1.6), 0.28, Math.atan2(-dz, dx)]); break; } acc += L; } }
        for (let k = 0; k < 10; k++) { const a = R() * 6.28, d = R() * YARD.r * 0.8, x = YARD.x + Math.cos(a) * d, z = YARD.z + Math.sin(a) * d; pud.push([x, height(x, z), z, R.range(0.6, 1.8), R.range(0.4, 1.2), R() * 3]); }
        const pm = E.puddleMesh(pud); scene.add(pm); }
      // walls and fences round the farm: a stone wall with a gateway and a broken end, a brick wall by the ruin, a gate
      const sw = E.wall([[30, -50], [40, -45], [70, -44], [84, -50]], { type: 'stone', h: 1.3, gaps: [[14, 18]], brokenEnd: true, seed: 3, heightFn: height }); sw.group.name = 'IVEnv.wall:stone'; scene.add(sw.group);
      const bw = E.wall([[70, -104], [92, -106]], { type: 'brick', h: 1.8, t: 0.34, brokenStart: true, seed: 4, heightFn: height }); bw.group.name = 'IVEnv.wall:brick'; scene.add(bw.group);
      const f1 = E.fence([[36, -100], [36, -130], [70, -132]], 'rail', { heightFn: height, seed: 6, damage: 0.3 }); f1.group.name = 'IVEnv.fence:rail'; scene.add(f1.group);
      const f2 = E.fence([[-60, -60], [-60, -90]], 'barbed', { heightFn: height, seed: 7 }); f2.group.name = 'IVEnv.fence:barbed'; scene.add(f2.group);
      addProp('gate', 56.0, -44.3, 0, 8, { width: 3.4, open: 0.9 });
      // yard props
      addProp('cart', 62, -70, 0.4, 1); addProp('haystack', 82, -72, 1.5, 2); addProp('well', 60, -58, 0, 3); addProp('trough', 50, -66, 0.1, 4);
      addProp('crates', 44, -74, 0.2, 5); addProp('barrels', 46, -72.5, 0, 6); addProp('drums', 66, -84, 0.3, 7); addProp('ammo', 8.5, -61.5, 0.2, 8);
      addProp('sandbags', 6, -61.5, 0.3, 9, { length: 3.5, rows: 4 }); addProp('truck', 70, -76, 2.6, 10); addProp('logpile', 40, -86, 1.2, 11); addProp('tarp', 75, -88, 0.5, 12);
      addProp('ladder', 63.2, -64.6, Math.PI, 13); addProp('bottles', 50.3, -78.9, 0, 14);
      // telegraph poles along the lane with sagging wires
      const poles = []; for (let i = 0; i < 6; i++) { const t = i / 5, x = -60 + t * 72, z = 44 - t * 56 + 5; const p = addProp('telegraph', x, z, -0.7, 20 + i); poles.push({ p, x, z, y: height(x, z) }); }
      const wires = []; for (let i = 0; i < poles.length - 1; i++) for (const tp of poles[i].p.group.userData.wireTop) { const a = poles[i], b = poles[i + 1], c = Math.cos(-0.7), sn = Math.sin(-0.7); wires.push([a.x + tp[0] * c, a.y + tp[1], a.z - tp[0] * sn, b.x + tp[0] * c, b.y + tp[1], b.z - tp[0] * sn]); }
      const wm = E.wireMesh(wires, 0.006, 0.35); wm.name = 'IVEnv.prop:wires'; scene.add(wm);
      // a few wear decals from the runtime pool, as the game would on impacts
      [[52, 1.4, -76.24], [52.4, 1.1, -76.24], [51.7, 1.7, -76.24]].forEach((p) => E.impact('stone', p, [0, 0, 1]));
    }
    // one mesh per material for everything static (buildings, walls, fences, props)
    if (!qs.get('nomerge')) { const statics = new THREE.Group(); for (const o of scene.children.slice()) if (o.name && /^IVEnv\.(building|wall|fence|prop|hedge)/.test(o.name)) { scene.remove(o); statics.add(o); } scene.add(statics); scene.add(E.mergeStatic(statics, { cell: quality === 'low' ? 160 : 96 })); }
    window.T.ready = true;
  });

  // ---------------------------------------------------------------- free-fly camera
  const keys = {}; addEventListener('keydown', e => keys[e.code] = true); addEventListener('keyup', e => keys[e.code] = false);
  let drag = null;
  canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => { if (!drag || drag.id !== e.pointerId) return; pitchYaw.yaw -= (e.clientX - drag.x) * 0.004; pitchYaw.pitch = Math.max(-1.5, Math.min(1.5, pitchYaw.pitch - (e.clientY - drag.y) * 0.004)); drag.x = e.clientX; drag.y = e.clientY; });
  canvas.addEventListener('pointerup', () => drag = null);
  let touches = 0; canvas.addEventListener('touchstart', e => touches = e.touches.length); canvas.addEventListener('touchend', e => touches = e.touches.length);
  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); if (window.T.post) window.T.post.setSize(w, h); }
  addEventListener('resize', resize);

  window.T = { E, scene, camera, renderer, setCam, height, surfaceAt, CAMS, pitchYaw, get atmo() { return atmo; }, get grass() { return grass; }, get figure() { return figure; }, frameMs: 0 };
  setCam(qs.get('cam') || 'lane'); resize();
  let last = performance.now(), acc = 0, frames = 0, statT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (!window.T.ready) return;
    if (qs.get('shot')) { if (!(window.T.renderFrames > 0)) return; window.T.renderFrames--; }
    const sp = (keys.ShiftLeft || keys.ShiftRight ? 14 : 4) * dt, f = new THREE.Vector3(-Math.sin(pitchYaw.yaw), 0, -Math.cos(pitchYaw.yaw)), r = new THREE.Vector3(-f.z, 0, f.x);
    if (keys.KeyW || keys.ArrowUp || touches >= 2) camera.position.addScaledVector(f, sp);
    if (keys.KeyS || keys.ArrowDown) camera.position.addScaledVector(f, -sp);
    if (keys.KeyD || keys.ArrowRight) camera.position.addScaledVector(r, sp);
    if (keys.KeyA || keys.ArrowLeft) camera.position.addScaledVector(r, -sp);
    if (keys.KeyE) camera.position.y += sp; if (keys.KeyQ) camera.position.y -= sp;
    camera.rotation.set(pitchYaw.pitch, pitchYaw.yaw, 0, 'YXZ');
    const sdt = qs.get('shot') ? (window.T.fixedDt != null ? window.T.fixedDt : 1 / 30) : dt;
    if (!window.T.frozen) E.update(sdt, camera); else E.update(0, camera);
    const t0 = performance.now();
    if (window.T.post) window.T.post.render(dt); else renderer.render(scene, camera);
    acc += performance.now() - t0; frames++;
    if (now - statT > 500) {
      const gi = grass.info();
      window.T.frameMs = acc / frames;
      document.getElementById('stats').textContent =
        `draw calls ${(E.sceneInfo || renderer.info.render).calls}   triangles ${((E.sceneInfo || renderer.info.render).triangles / 1000).toFixed(0)}k\n` +
        `cpu render ${(acc / frames).toFixed(2)} ms   textures ${E.info.textureMB} MB   made in ${(E.genMs / 1000).toFixed(2)} s\n` +
        `grass: ${Object.entries(gi.rings).map(([k, v]) => k + ' ' + (v.triangles / 1000).toFixed(0) + 'k').join(', ')}`;
      acc = 0; frames = 0; statT = now;
    }
    window.T.rendered = (window.T.rendered || 0) + 1;
  }
  requestAnimationFrame(frame);
})();
</script>
