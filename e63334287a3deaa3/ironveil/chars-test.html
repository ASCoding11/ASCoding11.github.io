<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Ironveil characters (dev viewer)</title>
<style>
  html,body{margin:0;height:100%;background:#1b1d1f;color:#e8e4d8;font:13px/1.35 system-ui,sans-serif;overflow:hidden}
  #ui{position:absolute;left:8px;top:8px;width:290px;max-height:calc(100% - 16px);overflow:auto;background:rgba(20,22,24,.86);border:1px solid #444;border-radius:6px;padding:8px;box-sizing:border-box}
  #ui h1{font-size:14px;margin:0 0 6px}
  #ui label{display:block;margin:6px 0 2px;color:#bdb6a2}
  #ui select,#ui input[type=range]{width:100%}
  .btns{display:flex;flex-wrap:wrap;gap:3px}
  .btns button{flex:0 0 auto;background:#34362f;color:#eee;border:1px solid #555;border-radius:3px;padding:2px 5px;font-size:11px;cursor:pointer}
  .btns button.on{background:#6b6a3c;border-color:#aa9}
  #stats{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.6);padding:6px 8px;border-radius:5px;font:12px monospace;white-space:pre}
  #load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;pointer-events:none}
  @media (max-width:640px){#ui{width:auto;right:8px;top:auto;bottom:8px;max-height:45%}}
</style>
</head>
<body>
<div id="load">Loading characters… <span id="pct">0%</span></div>
<div id="ui">
  <h1>Ironveil characters</h1>
  <label>Character</label><select id="kind"></select>
  <label>Full-body clip (play)</label><div class="btns" id="clips"></div>
  <label>Upper-body layer (setUpper)</label><div class="btns" id="uppers"></div>
  <label>Aim pitch <span id="pv">0</span></label><input type="range" id="pitch" min="-1" max="1" step="0.01" value="0">
  <label>Aim yaw <span id="yv">0</span></label><input type="range" id="yaw" min="-1" max="1" step="0.01" value="0">
  <label>Weapon</label><select id="weapon"><option value="">none</option></select>
  <label>Socket</label><select id="socket"><option>handR</option><option>handL</option><option>back</option><option>sling</option><option>hip</option></select>
  <label>Camera</label><div class="btns" id="cams"></div>
  <label>Speed <span id="sv">1</span></label><input type="range" id="speed" min="0" max="2" step="0.05" value="1">
  <label>Drive (WASD, Shift sprint, C crouch, Z prone, Q aim; ground has a 15&deg; slope and 0.2 m steps)</label><div class="btns"><a href="?drive=1&weapon=rifleScoped" style="color:#cfc">open drive mode</a></div>
  <label>Stress test</label><div class="btns"><button id="stress">16 actors walking</button><button id="stressOff">clear</button><button id="pause">pause</button></div>
</div>
<div id="stats"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assets/lib/GLTFLoader.js"></script>
<script src="assets/lib/SkeletonUtils.js"></script>
<script src="chars.js"></script>
<script>
(function () {
  'use strict';
  var P = new URLSearchParams(location.search);
  var auto = P.has('shot');                      // screenshot mode: fixed time, no UI
  var W = innerWidth, H = innerHeight;
  var r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: auto });
  r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(W, H);
  r.outputEncoding = THREE.sRGBEncoding; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0;
  r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.prepend(r.domElement);
  var sc = new THREE.Scene();
  sc.background = new THREE.Color(0x9aa6b0); sc.fog = new THREE.Fog(0x9aa6b0, 30, 90);
  // soft sky environment for reflections (made in code)
  (function () {
    var es = new THREE.Scene();
    var g = new THREE.SphereGeometry(10, 32, 16), c = [], pos = g.attributes.position;
    for (var i = 0; i < pos.count; i++) { var y = pos.getY(i) / 10; var k = Math.max(0, y); c.push(0.55 + 0.35 * k, 0.6 + 0.3 * k, 0.66 + 0.3 * k); if (y < 0) { c[c.length - 3] = 0.32; c[c.length - 2] = 0.29; c[c.length - 1] = 0.24; } }
    g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
    es.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
    var pm = new THREE.PMREMGenerator(r);
    sc.environment = pm.fromScene(es, 0.02).texture;
  })();
  sc.add(new THREE.HemisphereLight(0xcfd8e2, 0x5b5040, 0.55));
  var sun = new THREE.DirectionalLight(0xfff0dc, 2.0); sun.position.set(4, 7, 5); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
  var sca = sun.shadow.camera; sca.left = -6; sca.right = 6; sca.top = 6; sca.bottom = -6; sca.far = 30;
  sc.add(sun);
  // ground: a code-made dirt/grass texture
  (function () {
    var cv = document.createElement('canvas'); cv.width = cv.height = 256; var x = cv.getContext('2d');
    x.fillStyle = '#6a6248'; x.fillRect(0, 0, 256, 256);
    for (var i = 0; i < 2500; i++) { var v = Math.random(); x.fillStyle = 'rgba(' + (60 + v * 50 | 0) + ',' + (60 + v * 45 | 0) + ',' + (40 + v * 25 | 0) + ',0.5)'; x.fillRect(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 4, 2 + Math.random() * 4); }
    var t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 30); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
    var gm = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ map: t, roughness: 1 }));
    gm.rotation.x = -Math.PI / 2; gm.receiveShadow = true; sc.add(gm);
    if (P.has('gravel')) {   // dark gravel like the game's paths: small rounded grey stones on dark soil
      var cg = document.createElement('canvas'); cg.width = cg.height = 512; var g2 = cg.getContext('2d');
      g2.fillStyle = '#23211e'; g2.fillRect(0, 0, 512, 512);
      for (var j = 0; j < 6000; j++) {
        var gv = 45 + Math.random() * 55 | 0, rr = 1.5 + Math.random() * 4;
        g2.fillStyle = 'rgb(' + gv + ',' + (gv - 3) + ',' + (gv - 8) + ')';
        g2.beginPath(); g2.ellipse(Math.random() * 512, Math.random() * 512, rr, rr * (0.6 + Math.random() * 0.4), Math.random() * 3, 0, 6.3); g2.fill();
      }
      var tg = new THREE.CanvasTexture(cg); tg.wrapS = tg.wrapT = THREE.RepeatWrapping; tg.repeat.set(60, 60); tg.encoding = THREE.sRGBEncoding; tg.anisotropy = 8;
      gm.material = new THREE.MeshStandardMaterial({ map: tg, roughness: 0.95 });
    }
    if (P.has('grey')) {   // neutral mid-grey floor (own plane, so nothing of the sand material carries over)
      gm.visible = false;
      var gg = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: new THREE.Color(0x4a4a4a).convertSRGBToLinear(), roughness: 0.95, metalness: 0 }));
      gg.rotation.x = -Math.PI / 2; gg.receiveShadow = true; sc.add(gg);
    }
  })();
  if (P.get('light') === 'overcast') {   // the game's overcast day: soft sky light, weak diffuse sun, grey haze
    sc.background = new THREE.Color(0x8f969c); sc.fog = new THREE.Fog(0x8f969c, 30, 140);
    sc.children.forEach(function (o) {
      if (o.isHemisphereLight) { o.color.set(0xd8dde2); o.groundColor.set(0x4a4740); o.intensity = 0.9; }
      if (o.isDirectionalLight) { o.color.set(0xeef0f2); o.intensity = 0.7; o.position.set(3, 9, 4); }
    });
  }
  if (P.get('light') === 'night') {   // night_moon with one warm lamp beside the soldier
    sc.background = new THREE.Color(0x05070c); sc.fog = new THREE.Fog(0x05070c, 20, 90);
    sc.children.forEach(function (o) {
      if (o.isHemisphereLight) { o.color.set(0x4c5a78); o.groundColor.set(0x0a0b0a); o.intensity = 0.2; }
      if (o.isDirectionalLight) { o.color.set(0x9fb4d8); o.intensity = 0.45; o.position.set(-5, 9, 3); }
    });
    var lamp = new THREE.PointLight(0xffb066, 6, 9, 2); lamp.position.set(1.4, 2.3, 1.2); lamp.castShadow = true; sc.add(lamp);
    var bulb = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffd8a0 })); bulb.position.copy(lamp.position); sc.add(bulb);
    sc.environment = null;
  }
  if (P.has('night')) {   // cold moonlight over dark grass, to check that characters still read at distance
    sc.background = new THREE.Color(0x070a10); sc.fog = new THREE.Fog(0x070a10, 25, 110);
    sc.children.forEach(function (o) {
      if (o.isHemisphereLight) { o.color.set(0x5a6a88); o.groundColor.set(0x0c0e0a); o.intensity = 0.22; }
      if (o.isDirectionalLight) { o.color.set(0x9fb4d8); o.intensity = 0.55; o.position.set(-5, 9, 3); }
      if (o.isMesh && o.material && o.material.map) { o.material.color.set(0x2a3320); }
    });
    sc.environment = null;
  }
  var cam = new THREE.PerspectiveCamera(35, W / H, 0.05, 200);
  IVChars.camera = cam;
  var orbit = { yaw: 0.35, pitch: 0.08, dist: 4.2, ty: 0.95 };
  var CAMS = {
    front: { yaw: 0, pitch: 0.05, dist: 4.4, ty: 0.92 }, side: { yaw: Math.PI / 2, pitch: 0.05, dist: 4.4, ty: 0.92 },
    back: { yaw: Math.PI, pitch: 0.05, dist: 4.4, ty: 0.92 }, threeq: { yaw: 0.6, pitch: 0.1, dist: 4.4, ty: 0.92 },
    face: { face: true, yaw: 0.35, dist: 0.7 }, ots: { ots: true }, ots2: { ots2: 0 }, ots45: { ots2: 45 }, wide: { yaw: 0.5, pitch: 0.35, dist: 14, ty: 0.8 }
  };
  function placeCam() {
    if (P.has('fpbody') && actor && actor.bone('Head')) {   // first-person body: eye camera looking down (look=-60)
      actor.setFirstPerson(true);
      var hd = actor.bone('Head'); hd.updateMatrixWorld(true);
      var e = new THREE.Vector3(0, 0.09, 0.1).applyMatrix4(hd.matrixWorld);
      cam.fov = 75; cam.near = 0.05; cam.updateProjectionMatrix();
      cam.position.copy(e); cam.rotation.set(+(P.get('look') || -60) * Math.PI / 180, Math.PI + actor.root.rotation.y, 0, 'YXZ');
      return;
    }
    if (P.get('cbone') && actor && actor.bone(P.get('cbone'))) {   // close-up on a bone (e.g. hand_r)
      var hb = new THREE.Vector3().setFromMatrixPosition(actor.bone(P.get('cbone')).matrixWorld);
      cam.position.set(hb.x + Math.sin(orbit.yaw) * Math.cos(orbit.pitch) * orbit.dist, hb.y + Math.sin(orbit.pitch) * orbit.dist, hb.z + Math.cos(orbit.yaw) * Math.cos(orbit.pitch) * orbit.dist);
      cam.lookAt(hb); return;
    }
    if (orbit.face && actor && actor.bone('Head')) {   // face close-up follows the head bone
      var h = new THREE.Vector3().setFromMatrixPosition(actor.bone('Head').matrixWorld).add(new THREE.Vector3(0, 0.07, 0));
      cam.position.set(h.x + Math.sin(orbit.yaw) * orbit.dist, h.y + 0.02, h.z + Math.cos(orbit.yaw) * orbit.dist); cam.lookAt(h); return;
    }
    if (orbit.ots2 != null) {   // player camera: 1.7 m behind, 0.85 m right, a little above the shoulder; ots45: 45 degrees round
      var bp = actor ? actor.root.position : new THREE.Vector3();
      if (cam.fov !== 60) { cam.fov = 60; cam.updateProjectionMatrix(); }
      if (!orbit.ots2) { cam.position.set(bp.x - 0.85, bp.y + 1.68, bp.z - 1.7); cam.lookAt(bp.x - 0.25, bp.y + 1.3, bp.z + 4); }
      else { cam.position.set(bp.x - 1.75, bp.y + 1.6, bp.z - 1.45); cam.lookAt(bp.x, bp.y + 1.15, bp.z + 0.5); }
      return;
    }
    if (orbit.ots) {   // over-the-shoulder game camera: 2.5 m behind, right shoulder
      var base = actor ? actor.root.position : new THREE.Vector3();
      cam.position.set(base.x - 0.7, 1.7, base.z - 2.5); cam.lookAt(base.x - 0.35, 1.45, base.z + 4); return;
    }
    cam.position.set(Math.sin(orbit.yaw) * Math.cos(orbit.pitch) * orbit.dist, orbit.ty + Math.sin(orbit.pitch) * orbit.dist, Math.cos(orbit.yaw) * Math.cos(orbit.pitch) * orbit.dist);
    cam.lookAt(0, orbit.ty, 0);
  }
  var drag = null;
  r.domElement.addEventListener('pointerdown', function (e) { drag = [e.clientX, e.clientY]; orbit.ots = false; });
  addEventListener('pointerup', function () { drag = null; });
  addEventListener('pointermove', function (e) { if (!drag) return; orbit.yaw -= (e.clientX - drag[0]) * 0.008; orbit.pitch = Math.max(-0.3, Math.min(1.2, orbit.pitch + (e.clientY - drag[1]) * 0.005)); drag = [e.clientX, e.clientY]; });
  r.domElement.addEventListener('wheel', function (e) { orbit.dist = Math.max(0.6, Math.min(30, orbit.dist * (1 + e.deltaY * 0.001))); e.preventDefault(); }, { passive: false });
  addEventListener('resize', function () { W = innerWidth; H = innerHeight; r.setSize(W, H); cam.aspect = W / H; cam.updateProjectionMatrix(); });

  var actor = null, gun = null, crowd = [], paused = false, curClip = 'idle', curUpper = null, speed = 1;
  var $ = function (id) { return document.getElementById(id); };
  function spawn(kind) {
    if (actor) actor.dispose();
    actor = IVChars.spawn(kind); sc.add(actor.root); window.ACTOR = actor;
    actor.play(curClip, { fade: 0 }); actor.setUpper(curUpper, { fade: 0 });
    if (gun) attachGun();
  }
  function attachGun() {
    if (gun) actor.detach(gun);
    var k = $('weapon').value; gun = null;
    if (!k) return;
    gun = IVChars.weapon(k); actor.attach(gun, $('socket').value);
  }
  function buttons(el, names, cb, cls) {
    el.innerHTML = '';
    names.forEach(function (n) { var b = document.createElement('button'); b.textContent = n; b.onclick = function () { cb(n); mark(el, n); }; el.appendChild(b); });
  }
  function mark(el, n) { [].forEach.call(el.children, function (b) { b.classList.toggle('on', b.textContent === n); }); }
  var UPPERS = ['(none)', 'aimIdle', 'holdRifle', 'fire', 'reload', 'boltCycle', 'throw', 'signalMoveUp', 'aimPistol', 'firePistol', 'holdPistol', 'alert'];

  if (P.has('fallback')) IVChars.forceFallback = true;
  IVChars.load(function (p) { $('pct').textContent = Math.round(p * 100) + '%'; }).then(function () {
    $('load').style.display = 'none';
    ['hero', 'ally', 'rifleman', 'officer', 'sniper', 'gunner'].forEach(function (k) { var o = document.createElement('option'); o.textContent = k; $('kind').appendChild(o); });
    ['rifleScoped', 'smg', 'pistol', 'enemyRifle', 'enemySmg', 'mg', 'knife', 'binoculars', 'grenade'].forEach(function (k) { var o = document.createElement('option'); o.textContent = k; $('weapon').appendChild(o); });
    buttons($('clips'), IVChars.clips.filter(function (n) { return n !== 'fire'; }), function (n) { curClip = n; actor.play(n, { once: /^(death|hit|stagger|throw|melee|takedown|vault|reload|bolt|fire|breach|signal|salute)/.test(n) }); });
    buttons($('uppers'), UPPERS, function (n) { curUpper = n === '(none)' ? null : n; actor.setUpper(curUpper, { once: /^(fire|reload|bolt|throw|signal)/.test(n || '') }); });
    buttons($('cams'), Object.keys(CAMS), function (n) { orbit = Object.assign({}, CAMS[n]); });
    $('kind').onchange = function () { spawn(this.value); };
    $('weapon').onchange = attachGun; $('socket').onchange = attachGun;
    $('pitch').oninput = $('yaw').oninput = function () { $('pv').textContent = $('pitch').value; $('yv').textContent = $('yaw').value; actor.setAim(+$('pitch').value, +$('yaw').value); };
    $('speed').oninput = function () { speed = +this.value; $('sv').textContent = speed; };
    $('stress').onclick = function () { stress(+(P.get('stress') || 16)); };
    $('stressOff').onclick = function () { crowd.forEach(function (c) { c.a.dispose(); }); crowd = []; };
    $('pause').onclick = function () { paused = !paused; };
    // URL setup (also used by the screenshot script)
    $('kind').value = P.get('kind') || 'hero';
    curClip = P.get('anim') || 'idle'; curUpper = P.get('upper') || null;
    if (P.get('weapon')) { $('weapon').value = P.get('weapon'); }
    if (P.get('socket')) { $('socket').value = P.get('socket'); }
    spawn($('kind').value);
    if (P.get('weapon')) attachGun();
    if (P.get('cam')) orbit = Object.assign({}, CAMS[P.get('cam')] || CAMS.front);
    if (P.has('cyaw')) orbit = { yaw: +P.get('cyaw') * Math.PI / 180, pitch: +(P.get('cpitch') || 5) * Math.PI / 180, dist: +(P.get('cdist') || 2), ty: +(P.get('cty') || 1.4) };
    if (P.has('pitch') || P.has('yaw')) actor.setAim(+(P.get('pitch') || 0), +(P.get('yaw') || 0));
    if (P.has('lineup')) {   // all six kinds in a row (night check at 40 m uses cdist=40)
      actor.root.position.x = -5;
      ['ally', 'rifleman', 'officer', 'sniper', 'gunner'].forEach(function (k, i) {
        var a = IVChars.spawn(k); a.root.position.set(-3 + i * 2, 0, 0); a.play('idle', { fade: 0 }); a.update(0.3 * i); sc.add(a.root);
        crowd.push({ a: a, fixed: true });
      });
      orbit = { yaw: 0, pitch: 0.03, dist: +(P.get('cdist') || 40), ty: 1.0 };
    }
    if (P.get('stress')) stress(+P.get('stress'));
    if (P.has('pair')) {   // paired takedown: victim 0.42 m in front, same facing
      var v = IVChars.spawn(P.get('victim') || 'rifleman'); v.root.position.set(0, 0, 0.42); sc.add(v.root);
      v.play('takedownVictim', { fade: 0 }); actor.play('takedown', { fade: 0 }); curClip = 'takedown';
      crowd.push({ a: v, ang: 0, rad: 0, fixed: true });
      $('stress').disabled = true;
    }
    if (P.get('wview')) {   // weapon close-up: the gun alone, side-on, at the given distance
      actor.setVisible(false);
      var wv = IVChars.weapon(P.get('wview')); wv.position.set(0, 1.3, 0); wv.rotation.y = -Math.PI / 2 + (+(P.get('wyaw') || 0)) * Math.PI / 180; sc.add(wv);
      orbit = { yaw: 0, pitch: 0.05, dist: +(P.get('cdist') || 1.2), ty: 1.3 };
    }
    if (auto) {
      $('ui').style.display = 'none';
      var t = +(P.get('t') || 0), steps = Math.round(t * 30) + 12;
      if (P.get('anim')) { actor.play(curClip, { fade: 0, once: P.has('once') || /death|hit|throw|melee|vault|takedown|breach|signal|salute|stagger/.test(P.get('anim')) }); if (curUpper) actor.setUpper(curUpper, { fade: 0, once: P.has('once') }); steps = Math.round(t * 30); }
      if (P.get('face') != null) actor.setFace(+P.get('face'));
      if (P.get('sling')) actor.attach(IVChars.weapon(P.get('sling')), 'sling');   // a second gun slung on the back
      for (var i = 0; i < steps; i++) { actor.update(1 / 30); crowd.forEach(function (c) { c.a.update(1 / 30); }); }
      if (P.get('blink') != null) { actor._blinkT = 1e9; actor.setMorph('blink', +P.get('blink')); }
      if (P.get('grips')) { var gj = JSON.parse(P.get('grips')); for (var gk in gj) IVChars.grips[gk] = gj[gk]; if (gun) actor.attach(gun, $('socket').value); for (var ii = 0; ii < 3; ii++) actor.update(1 / 30); }
      placeCam(); r.render(sc, cam);
      if (P.get('pen')) window.PEN = window.handPen(actor, gun);
      window.INFO = { pen: window.PEN, calls: r.info.render.calls, tris: r.info.render.triangles, heroTris: IVChars.tris($('kind').value), info: IVChars.info, clips: IVChars.clips.length };
      if (P.get('fps')) { measure(+P.get('fps')); } else window.READY = true;
      return;
    }
    window.TEST = { sc: sc, cam: cam, r: r, actor: function () { return actor; }, orbit: function (o) { orbit = o; }, placeCam: placeCam, gun: function () { return gun; } };
    if (P.has('drive')) { $('ui').style.display = auto ? 'none' : ''; window.DRIVE.start(P); return; }
    loop();
  });
  function stress(n) {
    crowd.forEach(function (c) { c.a.dispose(); }); crowd = [];
    var kinds = ['rifleman', 'officer', 'sniper', 'gunner'], guns = ['enemyRifle', 'pistol', 'rifleScoped', 'mg'];
    for (var i = 0; i < n; i++) {
      var k = kinds[i % 4], a = IVChars.spawn(k), ang = i / n * Math.PI * 2, rad = 3 + (i % 3) * 1.6;
      a.root.position.set(Math.cos(ang) * rad, 0, Math.sin(ang) * rad);
      a.root.rotation.y = -ang;   // walking around the circle
      a.play('walk', { fade: 0 }); a.update(i * 0.13);
      var g = IVChars.weapon(guns[i % 4]); a.attach(g, 'handR');
      sc.add(a.root); crowd.push({ a: a, ang: ang, rad: rad });
    }
    orbit = Object.assign({}, CAMS.wide);
  }
  var last = performance.now(), fpsN = 0, fpsT = 0, fps = 0;
  function measure(sec) {
    var t0 = performance.now(), frames = 0, upd = 0;
    function f() {
      var now = performance.now(), dt = Math.min(0.05, (now - (f.l || now)) / 1000); f.l = now;
      var u0 = performance.now();
      actor.update(dt); crowd.forEach(function (c) { step(c, dt); });
      upd += performance.now() - u0;
      placeCam(); r.render(sc, cam); frames++;
      if (now - t0 < sec * 1000) requestAnimationFrame(f);
      else { window.INFO.fps = frames / ((now - t0) / 1000); window.INFO.updateMsPerFrame = upd / frames; window.INFO.calls = r.info.render.calls; window.INFO.tris = r.info.render.triangles; window.READY = true; }
    }
    requestAnimationFrame(f);
  }
  function step(c, dt) {
    if (c.fixed) { c.a.update(dt); return; }
    c.ang += dt * 1.3 / c.rad;
    c.a.root.position.set(Math.cos(c.ang) * c.rad, 0, Math.sin(c.ang) * c.rad);
    c.a.root.rotation.y = -c.ang;
    c.a.update(dt);
  }
