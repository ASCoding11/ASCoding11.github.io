    const ends = vm.sleeveEnds([]);

    // the gun's top line at the screen centre column: sight line when aimed
    return { handTopPx: handTop === 1e9 ? null : Math.round(handTop * 10) / 10, sightPx: 360, sleeveEndsOnScreen: sleeveOn, tris: vm.tris() };
  };
  // sheet: rows of { gun, clip, t, ads, sprint, label }, columns of views; returns a JPEG data URL and per-row checks
  VMT.sheet = function (rows, opts) {
    opts = opts || {};
    const cols = opts.cols || ['eye', 'left', 'right', 'top', 'under'], cw = opts.cw || 384, ch = opts.ch || 216, cells = [], info = [];
    // one scene per row: each row is drawn into its cells before the next row is posed
    const r = renderer(), W = cw * cols.length, Hh = ch * rows.length + 26;
    const out = document.createElement('canvas'); out.width = W; out.height = Hh;
    const c2 = out.getContext('2d'); c2.fillStyle = '#111'; c2.fillRect(0, 0, W, Hh); c2.font = '13px monospace';
    if (opts.title) { c2.fillStyle = '#eee'; c2.fillText(opts.title, 8, 18); }
    rows.forEach((row, ri) => {
      const st = { ads: row.ads || 0, sprint: row.sprint || 0, crouch: row.crouch || 0, prone: row.prone || 0 };
      const { V, vm, ev } = VMT.pose(row.gun, row.clip, row.t || 0, st, row);
      const chk = VMT.checks(row.gun), cov = VMT.coverage(V.scene, VMT.camera('eye', null, 0, 16 / 9));
      info.push(Object.assign({ row: row.label || (row.gun + ' ' + (row.clip || 'idle') + ' ' + (row.t || 0)), ev }, chk, cov));
      const f = VMT.focus(vm, row.focus || 'left');
      r.setSize(W, ch); r.setScissorTest(true); r.setClearColor(0x111111);
      cols.forEach((view, ci) => {
        const cam = VMT.camera(view, f, row.dist || 0.42, cw / ch);
        r.setViewport(ci * cw, 0, cw, ch); r.setScissor(ci * cw, 0, cw, ch); r.render(V.scene, cam);
      });
      r.setScissorTest(false);
      c2.drawImage(r.domElement, 0, 0, W, ch, 0, 26 + ri * ch, W, ch);
      cols.forEach((view, ci) => {
        const x = ci * cw, y = 26 + ri * ch;
        c2.strokeStyle = '#000'; c2.strokeRect(x + 0.5, y + 0.5, cw - 1, ch - 1);
        if (view === 'eye') {
          c2.strokeStyle = 'rgba(255,80,80,0.9)'; c2.beginPath(); c2.moveTo(x + cw / 2 - 6, y + ch / 2); c2.lineTo(x + cw / 2 + 6, y + ch / 2); c2.moveTo(x + cw / 2, y + ch / 2 - 6); c2.lineTo(x + cw / 2, y + ch / 2 + 6); c2.stroke();
        }
        const lab = ci === 0 ? (row.label || (row.gun + ' ' + (row.clip || 'idle') + ' t' + (row.t || 0) + (st.ads ? ' ads' + st.ads : '') + (st.sprint ? ' spr' : ''))) + '  ' + cov.cover + '%' : view;
        c2.fillStyle = 'rgba(0,0,0,0.6)'; c2.fillRect(x, y, c2.measureText(lab).width + 8, 17); c2.fillStyle = '#fff'; c2.fillText(lab, x + 4, y + 13);
      });
    });
    return { img: out.toDataURL('image/jpeg', 0.88), info };
  };
  // bake: close every grip of a gun (and the prop grips) onto the real meshes; returns the BAKED table entries
  VMT.bake = function (kind) {
    const out = {}, src = kind === 'props' ? IVVM.PROPGRIPS : IVVM.GRIPS[kind], built = {};
    for (const n in src) {
      const g = src[n]; if (typeof g !== "object" || g.like) continue;
      const obj = kind === 'props' ? g.object : kind; if (!obj) continue;
      const M0 = IVVM.gripMatrix(g), c = new THREE.Vector3(0, 0.06, 0).applyMatrix4(M0);
      let tris = VMT.near(obj, c.x, c.y, c.z, 0.13);
      for (const w of g.solveWith || []) {   // another hand already on the gun (the firing hand under a pistol's support hand)
        const b2 = built[w]; if (!b2) continue;
        const m = IVVM.gripMatrix(src[w]), P = b2.geometry.attributes.position, I = b2.geometry.index.array, v = new THREE.Vector3(), add = [];
        for (let i = 0; i < I.length; i++) { v.fromBufferAttribute(P, I[i]).applyMatrix4(m); add.push(v.x, v.y, v.z); }
        const all = new Float32Array(tris.length + add.length); all.set(tris); all.set(add, tris.length); tris = all;
      }
      const sdf = VMT.sdfOf(tris);
      const b = IVHands.build(IVVM.gripPose(g, kind, n, sdf)); built[n] = b;
      const curls = {}; for (const f in b.curls) if (!(g.pose.fingers && g.pose.fingers[f] && g.pose.fingers[f].fixed)) curls[f] = b.curls[f];
      out[n] = { curls }; if (g.pose.thumb && g.pose.thumb.close) out[n].thumb = b.thumbDirs;
    }
    return out;
  };

  // sweep every clip of a gun at 30 Hz (hip, and aimed for fire / fireAds and the raise): sleeve ends on screen, the
  // highest hand vertex aimed (px from the top of a 1280x720 frame; must be below the 360 sight line), events seen
  VMT.sweep = function (kind) {
    const V = VMT.vm(kind), vm = V.vm, out = {}, cam = VMT.camera('eye', null, 0, 16 / 9), v = new THREE.Vector3();
    const handTop = () => { let top = 1e9; for (const m of [vm.hands.handL, vm.hands.handR, vm.hands.handP]) { if (!m || !m.visible) continue; const P = m.geometry.attributes.position; for (let i = 0; i < P.count; i++) { v.fromBufferAttribute(P, i).applyMatrix4(m.matrixWorld); if (v.z > -0.01) continue; v.project(cam); if (Math.abs(v.x) <= 1 && Math.abs(v.y) <= 1) top = Math.min(top, (1 - v.y) / 2 * 720); } } return top; };
    const ends = () => { let n = 0; for (const e of vm.sleeveEnds([])) { if (e.z > -0.01) continue; const q = e.clone().project(cam); if (Math.abs(q.x) < 1 && Math.abs(q.y) < 1) n++; } return n; };
    const clips = vm.clips.filter(n => !/^(idle|ads|sprint|adsRaise)$/.test(n));
    for (const c of clips) for (const ads of (/^fire/.test(c) ? [0, 1] : [0])) {
      const st = { ads }; vm.stop(0); for (let i = 0; i < 40; i++) vm.drive(st, 1 / 60);
      vm.play(c); const L = vm.clipLength(c), evs = []; let worstEnds = 0, top = 1e9, frames = 0; const badT = [];
      for (let t = 0; t < L + 0.2; t += 1 / 30) { evs.push(...vm.drive(st, 1 / 30).map(e => e.name)); { const e = ends(); if (e) badT.push(+t.toFixed(2)); worstEnds = Math.max(worstEnds, e); } if (ads) top = Math.min(top, handTop()); frames++; }
      out[c + (ads ? '@ads' : '')] = { len: L, events: evs.join(','), sleeveEndsMax: worstEnds, at: badT.length ? badT.join(' ') : undefined, handTopAds: ads ? +top.toFixed(1) : undefined, frames };
    }
    // the raise and aimed idle: every 1/30 s of the 0.19 s smootherstep, plus aimed idle
    vm.stop(0); let top = 1e9, worst = 0;
    for (let i = 0; i <= 12; i++) { const k = i / 12, a = k * k * k * (k * (k * 6 - 15) + 10); vm.drive({ ads: a }, 1 / 60); if (a > 0.97) top = Math.min(top, handTop()); worst = Math.max(worst, ends()); }
    out.raise = { handTopAds: +top.toFixed(1), sleeveEndsMax: worst };
    for (const sp of [1]) { vm.stop(0); for (let i = 0; i < 30; i++) vm.drive({ sprint: sp }, 1 / 60); out.sprint = { sleeveEndsMax: ends() }; }
    return out;
  };
  // ---------------------------------------------------------------- hand study (step 1): one grip on a gun
  // provisional placement of the gun in the eye frame until the framing table exists
  VMT.gunPose = { smg: { p: [0.17, -0.19, -0.25], r: [0.16, Math.PI + 0.26, -0.06] } };
  VMT.handStudy = function (kind, gripNames, opts) {
    opts = opts || {};
    const sc = stage(), root = new THREE.Group(), gp = (opts.pose || VMT.gunPose[kind]);
    root.position.fromArray(gp.p); root.rotation.set(gp.r[0], gp.r[1], gp.r[2], 'YXZ');
    const gun = VMT.weapon(kind); gun.traverse(o => { if (/sling/.test(o.name)) o.visible = false; }); root.add(gun);
    const M = IVHands.materials(), info = {};
    for (const gn of gripNames) {
      const g = VMT.GR(kind, gn);
      let sdf = null;
      if (opts.solve) { const M0 = IVVM.gripMatrix(g), c = new THREE.Vector3(0, 0.06, 0).applyMatrix4(M0); sdf = VMT.sdfOf(VMT.near(kind, c.x, c.y, c.z, 0.13)); }
      const b = IVVM.buildGrip(g, sdf);
      const mesh = new THREE.Mesh(b.geometry, [M.glove, M.sleeve]); IVVM.gripMatrix(g, mesh.matrix); mesh.matrixAutoUpdate = false;
      root.add(mesh);
      info[gn] = { tris: b.tris, curls: b.curls, touch: b.fingers ? Object.fromEntries(Object.entries(b.fingers).map(([k, v]) => [k, v.touch])) : null, mesh };
    }
    sc.add(root); root.updateMatrixWorld(true);
    return { scene: sc, root, gun, info };
  };
  VMT.GR = (kind, gn) => IVVM.GRIPS[kind][gn];
  // contact check of a hand mesh against its gun: penetration depth (max, mm) and how many vertices are inside
  VMT.contact = function (kind, mesh, root) {
    const inv = new THREE.Matrix4().copy(root.matrixWorld).invert(), m = new THREE.Matrix4().multiplyMatrices(inv, mesh.matrixWorld);
    const P = mesh.geometry.attributes.position, v = new THREE.Vector3();
    const c = new THREE.Vector3(); mesh.geometry.computeBoundingSphere(); c.copy(mesh.geometry.boundingSphere.center).applyMatrix4(m);
    const sdf = VMT.sdfOf(VMT.near(kind, c.x, c.y, c.z, mesh.geometry.boundingSphere.radius + 0.02));
    let pen = 0, nIn = 0, near = 0;
    for (let i = 0; i < P.count; i++) { v.fromBufferAttribute(P, i).applyMatrix4(m); const d = sdf(v); if (d < 0) { nIn++; pen = Math.max(pen, -d); } if (d < 0.002) near++; }
    return { penMM: +(pen * 1000).toFixed(1), inside: nIn, within2mm: near, verts: P.count };
  };
  VMT.Q = Q;
  const l = new THREE.GLTFLoader(); if (window.MeshoptDecoder) l.setMeshoptDecoder(MeshoptDecoder);
  (window.MeshoptDecoder ? MeshoptDecoder.ready : Promise.resolve()).then(() => l.load('assets/weapons.glb?v=12', g => {
    g.scene.updateMatrixWorld(true);
    for (const k of ['rifleScoped', 'smg', 'pistol', 'grenade', 'binoculars', 'knife']) { const o = g.scene.getObjectByName(k); if (o) WT[k] = o; }
    window.__loaded = true;
  }, null, e => { window.__err = String(e); }));
})();
</script>
