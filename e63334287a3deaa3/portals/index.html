<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portals</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="/adspace.js" data-page defer></script>
<style>
  /* Portals: doorways out of the Back Room. Each opens the real site in a new tab (sites like Netflix refuse to run
     inside another page). The ring spins with transform only, so it costs the browser next to nothing. */
  :root{--bg:#0b0710;--ink:#f4eef8;--dim:#a99bb6;--red:#e50914;--red2:#ff5a36}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:clamp(28px,6vh,64px) 16px 40px;
    background:radial-gradient(ellipse at 50% 45%,rgba(229,9,20,.16),transparent 60%),var(--bg)}
  .back{align-self:flex-start;font:600 13px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-decoration:none}
  .back:hover{color:var(--ink)}
  h1{margin:18px 0 6px;font:800 clamp(40px,min(9vw,11vh),84px)/.95 "Big Shoulders Display",Impact,sans-serif;letter-spacing:.02em;text-transform:uppercase;text-align:center}
  .sub{margin:0 0 clamp(24px,5vh,48px);color:var(--dim);text-align:center;max-width:34em}
  .portal{position:relative;display:grid;place-items:center;width:min(78vw,340px,52vh);aspect-ratio:1;border-radius:50%;text-decoration:none;color:var(--ink);
    -webkit-tap-highlight-color:transparent;outline-offset:8px}
  .portal .ring{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,var(--red),#7a0010,var(--red2),#2a0006,var(--red),#7a0010,var(--red2),#2a0006,var(--red));
    -webkit-mask:radial-gradient(circle,transparent 58%,#000 59%,#000 70%,transparent 71%);mask:radial-gradient(circle,transparent 58%,#000 59%,#000 70%,transparent 71%);
    animation:spin 9s linear infinite;will-change:transform}
  .portal .glow{position:absolute;inset:8%;border-radius:50%;box-shadow:0 0 60px 10px rgba(229,9,20,.45),inset 0 0 60px rgba(229,9,20,.5)}
  .portal .core{position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle at 50% 40%,#3a0610,#12030a 70%)}
  .portal .name{position:relative;font:800 clamp(30px,min(10vw,8vh),64px)/1 "Big Shoulders Display",Impact,sans-serif;letter-spacing:.06em;color:var(--red);text-shadow:0 0 18px rgba(229,9,20,.6)}
  .portal .go{position:absolute;bottom:24%;font:600 12px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .portal:hover .go,.portal:focus-visible .go{color:var(--ink)}
  .portal:hover .ring{animation-duration:3s}
  .note{margin-top:clamp(24px,5vh,44px);font-size:14px;color:var(--dim);text-align:center;max-width:32em}
  @keyframes spin{to{transform:rotate(1turn)}}
  @media (prefers-reduced-motion:reduce){.portal .ring{animation:none}}
</style>
</head>
<body>
  <a class="back" href="/e63334287a3deaa3/">← Back Room</a>
  <h1>Portals</h1>
  <p class="sub">Step through to somewhere else.</p>
  <a class="portal" href="https://www.netflix.com/" target="_blank" rel="noopener noreferrer" aria-label="Netflix portal: opens Netflix in a new tab">
    <span class="glow"></span><span class="core"></span><span class="ring"></span>
    <span class="name">Netflix</span><span class="go">Enter →</span>
  </a>
  <p class="note">Opens Netflix in a new tab. Sign in with your own account.</p>
<script src="/analytics/tracker.js" data-site="portals" defer></script>
</body>
</html>
