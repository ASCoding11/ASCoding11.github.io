<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/namefilter.js"></script> <!-- masks rude words in player names (see README) -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tidewick</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e1030">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="style.css">
<script src="/e63334287a3deaa3/stats.js" data-game="tidewick" defer></script>
</head>
<body>
<!-- Tidewick: an 8-bit style side-scrolling platformer on a rainy harbour at dusk. The game is ES modules in js/
     (main.js starts it); every tunable number is in js/constants.js and the levels are rows of characters in js/level.js. -->
<div id="app">
  <div id="stageBox">
    <canvas id="screen" width="256" height="240" aria-label="Tidewick game screen"></canvas>
  </div>
  <div id="bar" class="kbonly">
    <span class="keys"><kbd data-kb="left right" data-kb-short data-kb-sep=" ">← →</kbd> move · <kbd data-kb="jump" data-kb-short>X</kbd> jump (hold for higher) · <kbd data-kb="run" data-kb-short>Z</kbd> run / spark · <kbd data-kb="down" data-kb-short>↓</kbd> crouch, chimney · <kbd data-kb="start" data-kb-short>Enter</kbd> pause · <kbd data-kb="mute" data-kb-short>M</kbd> sound · <kbd data-kb="fullscreen" data-kb-short>F</kbd> full screen</span>
    <button class="tbtn" id="keysBtn" type="button">Controls</button>
    <button class="tbtn" id="fsBtn" type="button">Full screen</button>
    <button class="tbtn" id="muteBtn" type="button">Sound on</button>
  </div>
  <div id="touch" aria-hidden="true">
    <div id="pad">
      <span class="pb" data-act="left"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="pb" data-act="down"><svg viewBox="0 0 24 24"><path d="m5 9 7 7 7-7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="pb" data-act="right"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <div id="acts">
      <button class="ab run" type="button" data-act="run">RUN</button>
      <button class="ab jump" type="button" data-act="jump">JUMP</button>
    </div>
  </div>
  <div id="tTop">
    <button class="tt" id="tMute" type="button" aria-label="Sound on" data-no-ad-refresh><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="tt" id="tPause" type="button" aria-label="Pause" data-no-ad-refresh>❚❚</button>
  </div>
</div>
<script src="../keybinds.js"></script>
<script type="module" src="js/main.js"></script>
<script src="/analytics/tracker.js" data-site="tidewick" defer></script>
</body>
</html>
