<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Yardstick</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#04111f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/e63334287a3deaa3/wordplay/kit.css">
<style>
/* Yardstick: two silhouettes on one drawing surface. The blue one is the reference (its real size is given); the yellow
   one is the target, which the player stretches until it looks the right real size, then locks in. */
:root{--ref:#7fa8ee;--tgt:#ffd166;--truth:#5ef08f;--paper:#071b36}
#game{background:radial-gradient(ellipse at 50% 30%,#0c2547 0%,#04111f 75%)}
#wrap{width:100%;max-width:980px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:8px 12px 10px;min-height:0}
#modeSlot{flex:none}
.mode .info{display:flex;align-items:center;gap:8px;min-width:0}
#catSel{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 8px;font:700 13px var(--f-u);max-width:44vw}
#pips{display:inline-flex;gap:5px;align-items:center}
#pips i{width:22px;height:8px;border-radius:4px;background:rgba(241,247,255,.14);display:block}
#pips i.now{background:var(--ink);box-shadow:0 0 0 2px rgba(241,247,255,.2)}
#pips i.s4{background:var(--green)}#pips i.s3{background:#b6e86a}#pips i.s2{background:var(--sun)}#pips i.s1{background:var(--coral)}#pips i.s0{background:var(--red)}

/* the two labels */
#labels{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lab{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:7px 10px 8px;border-left:5px solid var(--ref)}
.lab.t{border-left-color:var(--tgt)}
.lab small{display:block;font:800 10.5px var(--f-u);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.lab b{display:block;font:700 17px/1.15 var(--f-d);overflow-wrap:anywhere}
.lab .sz{display:block;font:800 14px/1.25 var(--f-u);color:var(--ref);font-variant-numeric:tabular-nums}
.lab.t .sz{color:var(--tgt)}
.lab .wh{display:block;font:600 12px/1.3 var(--f-u);color:var(--ink-2);margin-top:2px}

/* the drawing surface */
#stageBox{position:relative;flex:1 1 0;min-height:120px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
#stage text{font:800 12px var(--f-u);fill:var(--ink-2);font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
#refG{fill:var(--ref)}#tgtG{fill:var(--tgt);cursor:grab}
#stage.drag,#stage.drag #tgtG,#stage.drag #handle{cursor:grabbing}
#stage.pan{cursor:move}
#handle{cursor:grab}
#handle circle.k{fill:var(--ink);stroke:var(--night);stroke-width:2}
#handle path{fill:none;stroke:var(--night);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#zoomBar{position:absolute;right:8px;top:8px;display:flex;gap:5px;z-index:2}
#zoomBar button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(4,17,31,.78);color:var(--ink);font:700 18px/1 var(--f-d);cursor:pointer;padding:0;touch-action:manipulation}
#zoomBar button#zFit{width:auto;padding:0 10px;font-size:13px}
#zoomBar button:hover{background:rgba(20,45,85,.9)}
#scaleNote{position:absolute;left:10px;top:9px;font:800 11.5px var(--f-u);color:var(--ink-3);letter-spacing:.04em;pointer-events:none;display:flex;align-items:center;gap:6px}
#scaleNote i{display:block;height:7px;border:2px solid var(--ink-3);border-top:0;box-sizing:border-box}

/* controls under the stage */
#controls{flex:none;display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center}
.nudge{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);font:700 24px/1 var(--f-d);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;padding:0}
.nudge:hover{background:rgba(255,255,255,.13)}
.nudge:active{background:rgba(255,209,102,.3)}
#size{width:100%;min-width:0;height:46px;margin:0;accent-color:var(--tgt);cursor:pointer;touch-action:pan-y}
#lockBtn{padding:11px 20px}
#hint{flex:none;margin:-2px 0 0;font:600 12px/1.3 var(--f-u);color:var(--ink-3);text-align:center}

/* after locking in */
#result{flex:none;background:var(--panel-3);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center}
#result .pts{grid-row:1 / span 2;font:700 44px/1 var(--f-d);font-variant-numeric:tabular-nums;min-width:74px;text-align:center}
#result .pts small{display:block;font:800 11px var(--f-u);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
#result .cmp{font:700 15px/1.3 var(--f-u);color:var(--ink-2);font-variant-numeric:tabular-nums}
#result .cmp b{color:var(--ink)}#result .cmp .g{color:var(--tgt)}#result .cmp .a{color:var(--truth)}
#result .fact{font:600 13.5px/1.35 var(--f-u);color:var(--ink-2)}
#result .fact a{color:var(--ink-3)}
#result .cmp{grid-column:2;grid-row:1}#result .fact{grid-column:2;grid-row:2}
#result .cta{grid-row:1 / span 2;grid-column:3}
.c4{color:var(--green)}.c3{color:#b6e86a}.c2{color:var(--sun)}.c1{color:var(--coral)}.c0{color:var(--red)}

/* the end of the day */
#summary{flex:1 1 0;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
#summary .head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
#summary .tot{font:700 54px/1 var(--f-d);font-variant-numeric:tabular-nums}
#summary .tot em{font-style:normal;font-size:22px;color:var(--ink-3)}
#summary .head p{margin:0 0 6px;font:600 14px/1.35 var(--f-u);color:var(--ink-2);flex:1 1 200px}
#rows{display:flex;flex-direction:column;gap:5px}
.row5{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.4fr) 86px 40px;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font:700 13.5px/1.25 var(--f-u)}
.row5 .nm{font:700 15px/1.15 var(--f-d);overflow-wrap:anywhere}
.row5 .nm small{display:block;font:600 11.5px var(--f-u);color:var(--ink-3)}
.row5 .gv{color:var(--ink-2);font-variant-numeric:tabular-nums}
.row5 .gv b{color:var(--ink)}
.row5 .bar{height:9px;border-radius:5px;background:rgba(241,247,255,.1);overflow:hidden}
.row5 .bar i{display:block;height:100%;border-radius:5px;background:currentColor}
.row5 .sc{text-align:right;font:700 18px var(--f-d);font-variant-numeric:tabular-nums}
#galBox{position:relative;flex:none;height:clamp(170px,30vh,300px);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper)}
#gal{position:absolute;inset:0;width:100%;height:100%;display:block}
#gal g.it{fill:var(--ref)}#gal g.it.on{fill:var(--tgt)}
#galCap{margin:0;font:600 12.5px/1.35 var(--f-u);color:var(--ink-3)}
#galChips{display:flex;gap:6px;flex-wrap:wrap}
#galChips button{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:6px 11px;font:700 12.5px var(--f-u);color:var(--ink-2);cursor:pointer}
#galChips button.on{background:var(--tgt);color:#2a1d00;border-color:var(--tgt)}
#summary .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#summary .next{font:700 13px var(--f-u);color:var(--ink-3);font-variant-numeric:tabular-nums}

@media (min-width:900px) and (min-height:521px){
  #summary{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto 1fr;gap:10px 16px;align-content:start}
  #summary .head,#summary #rows,#summary .acts{grid-column:1}
  #summary #galCap{grid-column:2;grid-row:1;align-self:end}#summary #galChips{grid-column:2;grid-row:2;align-self:start}
  #summary #rows{grid-row:2 / span 2}#summary .acts{grid-row:4;align-self:start}
  #summary #galBox{grid-column:2;grid-row:3 / span 2;height:auto;min-height:240px;max-height:520px}
  .row5{grid-template-columns:minmax(0,1.2fr) minmax(0,1.5fr) 60px 40px}
}
@media (max-width:560px){
  #wrap{padding:6px 8px 8px;gap:6px}
  .lab{padding:6px 8px 7px}.lab b{font-size:15px}.lab .sz{font-size:13px}.lab .wh{font-size:11.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  #controls{grid-template-columns:auto 1fr auto;grid-template-areas:"m s p" "l l l"}
  #minus{grid-area:m}#size{grid-area:s}#plus{grid-area:p}#lockBtn{grid-area:l;width:100%}
  #result{grid-template-columns:auto 1fr;gap:4px 10px}
  #result .pts{font-size:36px;min-width:60px}
  #result .cta{grid-row:3;grid-column:1 / -1;width:100%}
  .row5{grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) 36px}.row5 .bar{display:none}
  #hint{display:none}
}
/* a phone held sideways: the drawing on the left, everything else in a column on the right */
@media (max-height:520px) and (min-aspect-ratio:6/5){
  #wrap{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,34%);grid-template-rows:auto minmax(0,1fr) auto;gap:6px 10px;padding:6px 10px 6px}
  #modeSlot{grid-column:2;grid-row:1}
  #stageBox{grid-column:1;grid-row:1 / span 3;min-height:0}
  #labels{grid-column:2;grid-row:2;grid-template-columns:1fr;grid-auto-rows:min-content;gap:5px;min-height:0;overflow:hidden}
  .lab{padding:4px 8px 5px}.lab b{font-size:14px}.lab .sz{font-size:12.5px}.lab .wh{font-size:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #controls,#result{grid-column:2;grid-row:3;align-self:end}
  #wrap.rev .lab.r{display:none}
  #pips i{width:14px}
  #controls{grid-template-columns:auto 1fr auto;grid-template-areas:"m s p" "l l l";gap:6px}
  #minus{grid-area:m}#size{grid-area:s}#plus{grid-area:p}#lockBtn{grid-area:l;width:100%;padding:8px 14px}
  .nudge{width:40px;height:40px}#size{height:40px}
  #result{grid-template-columns:auto 1fr;gap:3px 8px;padding:7px 9px}
  #result .pts{font-size:30px;min-width:52px}#result .fact{font-size:12px;max-height:5.4em;overflow:auto}#result .cmp{font-size:13px}
  #result .cta{grid-row:3;grid-column:1 / -1;width:100%;padding:7px 14px}
  #hint{display:none}
  #summary{grid-column:1 / -1;grid-row:2 / span 2}
  #summary .tot{font-size:40px}
  #galBox{height:150px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="game">
  <div id="wrap">
    <div id="modeSlot"></div>
    <div id="labels">
      <div class="lab r"><small>Reference</small><b id="refName"></b><span class="sz" id="refSize"></span><span class="wh" id="refWhat"></span></div>
      <div class="lab t"><small>Resize this one</small><b id="tgtName"></b><span class="sz" id="tgtSize"></span><span class="wh" id="tgtWhat"></span></div>
    </div>
    <div id="stageBox">
      <svg id="stage" role="img" aria-label="Drawing surface: the reference shape and the target shape standing on one ground line">
        <defs><mask id="tm" maskUnits="userSpaceOnUse" x="0" y="0" width="10" height="10"><g id="tmG"><g id="tmS" fill="none" stroke="#fff" stroke-linejoin="round"></g><g id="tmF" fill="#000" fill-rule="evenodd"></g></g></mask></defs>
        <path id="grid" fill="none" stroke="rgba(140,185,255,.09)" stroke-width="1"/>
        <path id="grid5" fill="none" stroke="rgba(140,185,255,.17)" stroke-width="1"/>
        <rect id="soil" fill="rgba(2,8,18,.5)"/>
        <path id="ticks" fill="none" stroke="rgba(241,247,255,.45)" stroke-width="1.5"/>
        <line id="ground" stroke="rgba(241,247,255,.75)" stroke-width="2"/>
        <g id="refG" fill-rule="evenodd"></g>
        <g id="refDim"><path fill="none" stroke="var(--ref)" stroke-width="1.5"/><text style="fill:var(--ref)"></text></g>
        <g id="tgtG" fill-rule="evenodd"></g>
        <rect id="truth" mask="url(#tm)" fill="var(--truth)" x="0" y="0" width="0" height="0"/>
        <g id="marks"><path id="mG" fill="none" stroke="var(--tgt)" stroke-width="1.5" stroke-dasharray="5 4"/><path id="mA" fill="none" stroke="var(--truth)" stroke-width="1.5" stroke-dasharray="5 4"/><text id="tG"></text><text id="tA"></text></g>
        <g id="handle"><circle r="24" fill="transparent"/><circle class="k" r="13"/><path d=""/></g>
      </svg>
      <div id="scaleNote" aria-hidden="true"><i></i><span></span></div>
      <div id="zoomBar"><button type="button" id="zOut" aria-label="Zoom the view out" title="Zoom the view out">−</button><button type="button" id="zFit" title="Fit both shapes in view">Fit</button><button type="button" id="zIn" aria-label="Zoom the view in" title="Zoom the view in">+</button></div>
    </div>
    <div id="controls">
      <button type="button" class="nudge" id="minus" aria-label="A little smaller" title="A little smaller (hold to keep going)">−</button>
      <input type="range" id="size" min="0" max="1000" step="1" value="500" aria-label="Size of the target shape">
      <button type="button" class="nudge" id="plus" aria-label="A little bigger" title="A little bigger (hold to keep going)">+</button>
      <button type="button" class="cta" id="lockBtn">Lock it in</button>
    </div>
    <p id="hint">Drag the yellow shape or its handle, use the slider, or press the arrow keys (Shift for tiny steps). Scroll or pinch to zoom the view.</p>
    <div id="result" hidden></div>
    <div id="summary" hidden></div>
  </div>
</main>
<script src="/e63334287a3deaa3/wordplay/kit.js"></script>
<script src="/e63334287a3deaa3/yardstick/objects.js"></script>
<script src="/e63334287a3deaa3/yardstick/pairs.js"></script>
<script>
'use strict';
(function () {
const K = Kit, h = K.h, $ = K.$;
const SLUG = 'yardstick', NAME = 'Yardstick', ROUNDS = 5;
const OBJ = window.YARDSTICK_OBJECTS || [], PAIRS = window.YARDSTICK_PAIRS || [], DAYS = window.YARDSTICK_DAYS || [];
const BY = {}; OBJ.forEach(o => { BY[o.id] = o; });
const NS = 'http://www.w3.org/2000/svg';
const CATS = [['', 'Everything'], ['animals', 'Animals'], ['vehicles', 'Vehicles'], ['buildings', 'Buildings and landmarks'], ['everyday', 'Everyday things'], ['sports', 'Sports']];

// ------------------------------------------------------------------ scoring (version 1)
// error = how many times too big or too small the guess is (always 1 or more), measured from the nearest end of the
// real range where the real thing has a range. Within 3% is full marks. Past that the score falls on a smooth curve in
// log space, so twice too big and half the size score the same: exactly 20. Change SCORE_V if this ever changes.
const SCORE_V = 1, TOL = 1.03, AT_DOUBLE = 0.2, SHAPE = 1.3, RANGE = 60;
function nearest(o, g) { return Math.min(o.hi != null ? o.hi : o.m, Math.max(o.lo != null ? o.lo : o.m, g)); }
function errorOf(o, g) { const a = nearest(o, g); return Math.max(g / a, a / g); }
function scoreOf(e) {
  const u = Math.log2(e / TOL); if (!(u > 0)) return 100;
  return Math.round(100 * Math.pow(AT_DOUBLE, Math.pow(u / Math.log2(2 / TOL), SHAPE)));
}
const band = s => s >= 90 ? 4 : s >= 70 ? 3 : s >= 45 ? 2 : s >= 20 ? 1 : 0;
const EMO = ['🟥', '🟧', '🟨', '🟩', '🎯'];
const WORD = ['Way off', 'Not close', 'In the right area', 'Close', 'Spot on'];

// ------------------------------------------------------------------ sizes as text
function sig(v, n) { return String(+v.toPrecision(n)); }
function metric(m, n) { n = n || 3; return m < 0.01 ? sig(m * 1000, n) + ' mm' : m < 1 ? sig(m * 100, n) + ' cm' : m < 1000 ? (m >= 100 && n < 4 ? Math.round(m) : sig(m, n)) + ' m' : sig(m / 1000, n) + ' km'; }
function us(m) {
  const inch = m / 0.0254;
  if (inch < 12) return sig(inch, 3) + ' in';
  if (inch < 120) { let f = Math.floor(inch / 12), i = Math.round(inch - f * 12); if (i === 12) { f++; i = 0; } return f + ' ft' + (i ? ' ' + i + ' in' : ''); }
  const ft = inch / 12; return ft < 5280 * 2 ? Math.round(ft).toLocaleString('en-US') + ' ft' : sig(ft / 5280, 3) + ' mi';
}
const both = (m, n) => metric(m, n) + ' (' + us(m) + ')';
const dimWord = o => o.dim === 'height' ? 'tall' : o.dim === 'diameter' ? 'across' : 'long';
const dimNoun = o => o.dim;
function realText(o) { return o.lo != null ? metric(o.lo, 4).replace(/ \S+$/, '') + ' to ' + metric(o.hi, 4) : both(o.m, 4); }
const realShort = o => o.lo != null ? metric(o.lo, 4).replace(/ \S+$/, '') + '–' + metric(o.hi, 4) : metric(o.m, 4);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// ------------------------------------------------------------------ shell
const HOW = '<p>Two shapes stand on one ground line, drawn to the <b>same scale</b>. The <b style="color:var(--ref)">blue</b> one is the reference, and you are told its real size. Stretch the <b style="color:var(--tgt)">yellow</b> one until it looks the right real-life size next to it, then <b>lock it in</b>.</p>' +
  '<ul><li><b>Resize:</b> drag the yellow shape or its round handle, use the slider, tap − and + for small steps, or press the arrow keys (hold Shift for tiny steps).</li>' +
  '<li><b>Zoom</b> (the buttons, the scroll wheel or a pinch) only changes how big both shapes are drawn. It never changes your answer.</li>' +
  '<li>You never type a number. After you lock in you see the real size as a green outline, the real measurement and a fact.</li>' +
  '<li><b>Five rounds</b>, up to <b>100 points</b> each. What counts is how many <i>times</i> too big or too small you were: within 3% is 100, 10% out is about 92, 25% out about 72, half as much again 46, and <b>twice too big scores the same as half the size: 20</b>.</li></ul>' +
  '<p>Heights are only ever compared with heights, and lengths with lengths. Every size was looked up and its source is shown after each round.</p>';
const DIST = [['5', '450+'], ['4', '400+'], ['3', '350+'], ['2', '300+'], ['1', '200+'], ['0', '<200']];
const distKey = t => t >= 450 ? '5' : t >= 400 ? '4' : t >= 350 ? '3' : t >= 300 ? '2' : t >= 200 ? '1' : '0';
let st = null, lastDist = null;
const S = K.shell({
  slug: SLUG, name: NAME, how: HOW, dist: DIST, distTitle: 'Daily totals (out of 500)',
  foot: ' Each size has a source; tell Arjun if you spot one that is wrong.',
  shareText: () => st && st.mode === 'daily' && st.phase === 'done' ? shareText() : null,
  onModal: open => { // the shared Stats window shows "Win %"; a score game has no wins, so show the average instead
    if (!open) return;
    const box = document.querySelector('.modal .st4'); if (!box) return;
    const rec = K.Daily.load(SLUG), sc = Object.keys(rec.days).map(k => rec.days[k].score).filter(v => typeof v === 'number');
    box.children[1].innerHTML = '<b>' + (sc.length ? Math.round(sc.reduce((a, b) => a + b, 0) / sc.length) : '–') + '</b><small>Average score</small>';
  }
});
const mb = K.modeBar($('modeSlot'), m => start(m));
const pips = h('span', { id: 'pips', role: 'img' }), catSel = h('select', { id: 'catSel', 'aria-label': 'Practice category' }, CATS.map(c => h('option', { value: c[0], text: c[1] })));
const freeInfo = h('span', { id: 'freeInfo' });
mb.info.append(catSel, freeInfo, pips);
catSel.value = K.store.get(SLUG + ':cat', '') || '';
if (catSel.selectedIndex < 0) catSel.value = '';
catSel.addEventListener('change', () => { K.store.set(SLUG + ':cat', catSel.value); if (st && st.mode === 'free') start('free'); });

// ------------------------------------------------------------------ rounds
function startSize(ref, tgt, r) {
  // an arbitrary starting size, chosen from the REFERENCE's size (anywhere from a fifth of it to five times it), so it
  // says nothing about the answer; if it lands on the answer by luck it is moved off it
  let g = ref.m * Math.exp((r() * 2 - 1) * Math.log(5));
  if (errorOf(tgt, g) < 1.15) g *= r() < 0.5 ? 1.6 : 1 / 1.6;
  return g;
}
function dayPairs(day) { const n = K.dayNum(day) - 1, L = DAYS.length; return DAYS[((n % L) + L) % L].slice(); }
function freePairs() {
  const c = catSel.value, pool = []; PAIRS.forEach((p, i) => { if (!c || BY[p[1]].cat === c) pool.push(i); });
  return pool;
}
function save() {
  if (st.mode !== 'daily') return;
  K.store.set(SLUG + ':day', { day: st.day, sv: SCORE_V, pairs: st.pairs, rounds: st.rounds, t0: st.t0, t1: st.t1, done: st.phase === 'done' });
}
function start(m) {
  stopHold();
  if (m === 'daily') {

});
$('lockBtn').addEventListener('click', lock);
document.addEventListener('keydown', e => {
  if (S.isOpen() || e.ctrlKey || e.metaKey || e.altKey || !st) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'SELECT') return;
  const k = e.key;
  if (st.phase === 'play') {
    const amt = e.shiftKey ? 0.2 : 1;
    if (k === 'ArrowUp' || k === 'ArrowRight') { e.preventDefault(); step(amt); }
    else if (k === 'ArrowDown' || k === 'ArrowLeft') { e.preventDefault(); step(-amt / (1 + amt / 100)); }
    else if (k === 'PageUp') { e.preventDefault(); step(10); }
    else if (k === 'PageDown') { e.preventDefault(); step(-100 / 11); }
    else if (k === 'Enter' && tag !== 'BUTTON' && tag !== 'A') { e.preventDefault(); lock(); }
  } else if (st.phase === 'reveal' && k === 'Enter' && tag !== 'BUTTON' && tag !== 'A') { e.preventDefault(); next(); }
  if (st.phase !== 'done') {
    if (k === '+' || k === '=') setZoom(view.zoom * 1.35); else if (k === '-' || k === '_') setZoom(view.zoom / 1.35); else if (k === '0' || k === 'f' || k === 'F') $('zFit').click();
  }
});

// ------------------------------------------------------------------ the end of the day: total, rounds, share, gallery
let gal = null;
function showSummary() {
  const box = $('summary'), t = total(), b = t >= 450 ? 4 : t >= 350 ? 3 : t >= 225 ? 2 : t >= 100 ? 1 : 0;
  $('labels').hidden = true; $('stageBox').hidden = true; $('controls').hidden = true; $('hint').hidden = true; $('result').hidden = true;
  drawPips();
  const items = st.pairs.map((pi, i) => ({ ref: BY[PAIRS[pi][0]], tgt: BY[PAIRS[pi][1]], rd: st.rounds[i] }));
  box.innerHTML = '';
  box.append(
    h('div', { class: 'head' }, [h('div', { class: 'tot c' + b, html: t + ' <em>/ 500</em>' }),
      h('p', { text: ['A tough day for the tape measure. Tomorrow is a new five.', 'Some of these were a long way out. That is how you learn them.', 'A decent eye. A couple of these fooled you.', 'A sharp eye for size.', 'Outstanding: you could measure by looking.'][b] })]),
    h('div', { id: 'rows' }, items.map(it => h('div', { class: 'row5 c' + band(it.rd.s) }, [
      h('div', { class: 'nm', html: '' }, [it.tgt.name, h('small', { text: 'next to ' + it.ref.name })]),
      h('div', { class: 'gv', html: 'You <b>' + metric(it.rd.g) + '</b> · real <b>' + realShort(it.tgt) + '</b><br>' + offText(it.tgt, it.rd.g) }),
      h('div', { class: 'bar' }, [h('i', { style: 'width:' + it.rd.s + '%' })]),
      h('div', { class: 'sc', text: String(it.rd.s) })]))),
    h('div', { class: 'acts' }, [
      h('button', { type: 'button', class: 'cta', text: 'Share', onclick: () => S.share() }),
      h('button', { type: 'button', class: 'ghost', text: 'Play unlimited', onclick: () => start('free') }),
      h('button', { type: 'button', class: 'ghost', text: 'Stats', onclick: () => S.openStats(lastDist) }),
      h('span', { class: 'next', id: 'nextIn', text: 'Next five in ' + K.countdown() })]),
    h('p', { id: 'galCap', text: 'Today\'s five targets at their real sizes, all to one scale. Tap a name to zoom in on it.' }),
    h('div', { id: 'galChips', role: 'group', 'aria-label': 'Zoom the gallery' }),
    h('div', { id: 'galBox' }, [(() => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('id', 'gal'); s.setAttribute('role', 'img'); s.setAttribute('aria-label', 'Today\'s five targets drawn at one true scale'); return s; })()]));
  box.hidden = false; box.scrollTop = 0;
  buildGallery(items.map(it => it.tgt));
}
function buildGallery(objs) {
  // smallest to biggest, left to right, each at its real size (1000 units = its metres), on one ground line
  const list = objs.slice().sort((a, b) => Math.max(a.w, a.h) * a.m - Math.max(b.w, b.h) * b.m);
  const s = $('gal'), chips = $('galChips'); s.innerHTML = ''; chips.innerHTML = '';
  let x = 0; const its = list.map(o => { const k = o.m / 1000, w = o.w * k, hh = o.h * k, it = { o, k, x, w, h: hh }; x += w * 1.22; return it; });
  const line = document.createElementNS(NS, 'line'); line.setAttribute('stroke', 'rgba(241,247,255,.75)'); line.setAttribute('stroke-width', '2'); s.appendChild(line);
  its.forEach(it => { const g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'it'); g.setAttribute('fill-rule', 'evenodd'); it.o.p.forEach(d => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); g.appendChild(p); }); s.appendChild(g); it.g = g; });
  gal = { its, line, focus: its.length - 1, ppm: 0, ox: 0, raf: 0, snap: true };
  const mk = (label, i) => { const bt = h('button', { type: 'button', text: label, onclick: () => { gal.focus = i; galGo(); } }); chips.appendChild(bt); return bt; };
  gal.btns = its.map((it, i) => mk(it.o.name, i));
  galGo();
}
function galGo() {
  if (!gal) return;
  gal.btns.forEach((b, i) => { b.classList.toggle('on', i === gal.focus); b.setAttribute('aria-pressed', i === gal.focus); });
  gal.its.forEach((it, i) => it.g.classList.toggle('on', i === gal.focus));
  if (!gal.raf) gal.raf = requestAnimationFrame(galFrame);
}
function galFrame() {
  gal.raf = 0;
  const box = $('galBox').getBoundingClientRect(), W = Math.max(60, box.width), H = Math.max(60, box.height), s = $('gal');
  if (!box.width) return;
  s.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  // frame everything up to and including the chosen one; bigger ones run off the right-hand side
  const f = gal.its[gal.focus], cw = f.x + f.w, chh = Math.max.apply(null, gal.its.slice(0, gal.focus + 1).map(it => it.h));
  const ppm = Math.min((W - 28) / cw, (H - 34) / chh), ox = gal.focus === gal.its.length - 1 ? (W - cw * ppm) / 2 : 14, gy = H - 16;
  let moving = false;
  if (gal.snap) { gal.ppm = ppm; gal.ox = ox; gal.snap = false; }
  else { gal.ppm = Math.exp(Math.log(gal.ppm) + (Math.log(ppm) - Math.log(gal.ppm)) * 0.16); gal.ox += (ox - gal.ox) * 0.16; if (Math.abs(Math.log(ppm / gal.ppm)) > 0.002 || Math.abs(ox - gal.ox) > 0.3) moving = true; else { gal.ppm = ppm; gal.ox = ox; } }
  gal.line.setAttribute('x1', 0); gal.line.setAttribute('x2', W); gal.line.setAttribute('y1', gy); gal.line.setAttribute('y2', gy);
  gal.its.forEach(it => it.g.setAttribute('transform', 'translate(' + (gal.ox + it.x * gal.ppm).toFixed(2) + ' ' + gy + ') scale(' + (it.k * gal.ppm) + ')'));
  if (moving) gal.raf = requestAnimationFrame(galFrame);
}

addEventListener('resize', () => { if (st && st.phase !== 'done') resize(true); else if (gal) { gal.snap = true; galGo(); } });
if (window.ResizeObserver) new ResizeObserver(() => { if (st && st.phase !== 'done') resize(false); }).observe($('stageBox'));
setInterval(() => {
  const e = $('nextIn'); if (e) e.textContent = 'Next five in ' + K.countdown();
  if (st && st.mode === 'daily' && st.day !== K.today() && !drag && !S.isOpen()) start('daily');
}, 1000);
start('daily');
if (navigator.webdriver) window.__ys = {
  get st() { return st; }, view, OBJ, PAIRS, DAYS, BY, start, lock, next, setG, scoreOf, errorOf, nearest, scene, total, shareText, metric, us,
  truth: () => st.tgt.m, setZoom,
  play: (ref, tgt) => { const i = PAIRS.findIndex(p => p[0] === ref && p[1] === tgt); if (i < 0) return false; start('free'); st.rounds = []; beginRound(i); return true; }
};
})();
