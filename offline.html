<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline</title>
<!-- Offline mode (sw.js): shown for a page that isn't saved on this device while there's no internet. Self-contained on purpose. -->
<style>
  :root { --bg: #f6f4ef; --ink: #1d1b26; --ink-2: #6b6876; --line: #dcd8ce; --accent: #c4561c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15122a; --ink: #f2f0ea; --ink-2: #a7a3b5; --line: #34304a; --accent: #f0a23b; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink);
         font: 16px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { max-width: 380px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); margin: 0 auto 18px; box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 20%, transparent); }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; letter-spacing: -.01em; }
  p { color: var(--ink-2); margin: 0 0 1.4rem; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a, button { font: inherit; font-weight: 600; font-size: 14px; padding: .55rem 1.1rem; border-radius: 8px; border: 1px solid var(--line);
              background: transparent; color: var(--ink); cursor: pointer; text-decoration: none; }
  button { background: var(--ink); color: var(--bg); border-color: var(--ink); }
</style>
</head>
<body>
  <main>
    <div class="dot"></div>
    <h1>You're offline</h1>
    <p>This page isn't saved on this device yet. Games you've already played here still work without internet; online matches come back when you reconnect.</p>
    <div class="row">
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="/">Home page</a>
    </div>
  </main>
</body>
</html>
