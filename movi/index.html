<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161616">
  <meta name="description" content="Rank every movie you've seen by picking which one you liked more. Movi builds your 0–10 scores, shows what friends think, and finds what to watch next.">
  <link rel="canonical" href="https://ngcoding10.github.io/claude/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Movi">
  <meta property="og:title" content="Movi — stop rating movies, start ranking them">
  <meta property="og:description" content="Pick which film you liked more and Movi builds your scores. Follow friends, compare taste, find what to watch next.">
  <meta property="og:url" content="https://ngcoding10.github.io/claude/">
  <meta property="og:image" content="https://ngcoding10.github.io/claude/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Movi: rank every movie you've seen">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Movi">
  <title>Movi — rank every movie you've seen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="dns-prefetch" href="https://upload.wikimedia.org">
  <!-- Righteous only draws the logo and big score numbers, so only those characters are downloaded. -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Righteous&text=movi0123456789.%25%E2%80%93-&display=swap" rel="stylesheet">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/films.js">
  <link rel="modulepreload" href="js/data-version.js">
  <link rel="modulepreload" href="js/state.js">
  <link rel="modulepreload" href="js/api/index.js">
  <script src="config.js"></script>
</head>
<body>
  <a class="skip" href="#view" data-act="skip-main">Skip to content</a>
  <header class="topbar">
    <button class="iconbtn backbtn" id="backbtn" data-act="back" aria-label="Back" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
    <a class="logo" href="#/">movi</a>
    <nav class="topnav" id="topnav" aria-label="Main"></nav>
    <div class="topright" id="topright"></div>
  </header>
  <nav class="tabbar" id="tabbar" aria-label="Tabs"></nav>

  <main id="view" class="view" tabindex="-1">
    <div class="loading"><div class="reel"></div><p>Loading 36,000 films…</p></div>
    <noscript><p class="center-t">Movi needs JavaScript to rank films. Please turn it on and reload.</p></noscript>
  </main>

  <div id="sheet" class="sheet" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="flow" class="flow" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
