# Every pull request that changes something players can see must add a What's new entry
# (e63334287a3deaa3/news.js) - see CLAUDE.md. Changes to only docs (README, CLAUDE.md, comments in .github) pass
# without one, and a pull request labelled "no-news" skips the check.
name: What's new entry
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  news:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-news') }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check for a What's new entry
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          files="$(git diff --name-only "$base"...HEAD)"
          echo "$files"
          visible="$(echo "$files" | grep -vE '^(README\.md|CLAUDE\.md|\.github/)' || true)"
          if [ -z "$visible" ]; then echo "Docs only: no entry needed."; exit 0; fi
          if echo "$files" | grep -qx 'e63334287a3deaa3/news.js' && git diff "$base"...HEAD -- e63334287a3deaa3/news.js | grep -qE "^\+\s*\{date: '"; then
            echo "What's new entry found."
          else
            echo "::error file=e63334287a3deaa3/news.js::Add an entry to the top of NEWS in e63334287a3deaa3/news.js for this change (see CLAUDE.md), or label the pull request no-news if players can't notice it."
            exit 1
          fi
