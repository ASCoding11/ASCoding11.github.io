; Project Daedalus: an alternative to the Arduino IDE. With PlatformIO installed (the VS Code extension, or
; "pip install platformio"), open this folder and run:
;     pio run                build
;     pio run -t upload      build and flash the board plugged in by USB
;     pio device monitor     watch what the controller prints
; This is the set-up the sketch was last compiled with (esp32 Arduino core 3.3.12, NimBLE-Arduino 2.5.2).

[platformio]
src_dir = .

[env:daedalus]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@^2.5.2
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
board_build.f_cpu = 80000000L
monitor_speed = 115200
