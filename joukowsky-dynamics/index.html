<style>
  .gate { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .gate img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 62% 45%; background: var(--tape); min-height: 260px; }
  .gate form { padding: 28px; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
  .gate h3 { margin: 0; }
  .gate label { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
  .gate input { font: inherit; font-size: 17px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px; min-height: 44px; width: 100%; box-sizing: border-box; }
  .gate input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .gate .msg { min-height: 1.4em; margin: 0; font-size: 14px; color: var(--ink-2); }
  .gate .msg.bad { color: var(--down); }
  .gate .btn { align-self: flex-start; cursor: pointer; font: inherit; font-weight: 600; }
  @media (max-width: 820px) { .gate { grid-template-columns: minmax(0, 1fr); } .gate img { min-height: 0; aspect-ratio: 16 / 10; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="wordmark" href="../">Arjun</a>
    <nav class="nav" aria-label="Site"><a href="../">Home</a><a href="../projects/">Web Development Projects</a><a href="../productivity/">Productivity</a><a href="../engineering/" aria-current="page">Engineering Projects</a></nav>
  </div>
  <header>
    <p class="kicker">Engineering project</p>
    <h1>Joukowsky Dynamics</h1>
    <p class="intro">A road car whose four wheels swing up into ducted proprotors. The interactive workbench is password protected.</p>
  </header>

  <section aria-label="Open the workbench">
    <div class="gate">
      <img src="preview.jpg" alt="Holographic blueprint of the Joukowsky Dynamics car mid-conversion, wheels swung up into rotors." width="1920" height="1200">
      <form id="gate" autocomplete="off">
        <h3>Enter the password</h3>
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" spellcheck="false" required>
        <button class="btn primary" type="submit">Open the workbench</button>
        <p class="msg" id="msg" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <footer>© 2026 Arjun · <a href="../privacy.html">Privacy policy</a></footer>
</div>
<script src="/analytics/tracker.js" data-site="joukowsky-dynamics" defer></script>
<script src="/account/account.js" defer></script>
<script>
// The workbench lives in a folder named after a hash of the password, so this page never holds its address.
(function () {
  var KEY = 'jd-unlock';
  var form = document.getElementById('gate'), pw = document.getElementById('pw'), msg = document.getElementById('msg');
  async function folder(p) {
    var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('joukowsky:' + p.trim().toLowerCase()));
    return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('').slice(0, 16);
  }
  async function exists(dir) {
    var r = await fetch('/' + dir + '/', { cache: 'no-store' }).catch(function () { return { ok: false }; });
    return r.ok;
  }
  function open(dir) { location.href = '/' + dir + '/' + location.hash; }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved && /^[0-9a-f]{16}$/.test(saved)) {
    msg.textContent = 'Opening…';
    exists(saved).then(function (ok) {
      if (ok) open(saved);
      else { msg.textContent = ''; try { localStorage.removeItem(KEY); } catch (e) {} }
    });
  }
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!pw.value.trim()) return;
    msg.className = 'msg'; msg.textContent = 'Checking…';
    var dir = await folder(pw.value);
    if (await exists(dir)) {
      try { localStorage.setItem(KEY, dir); } catch (e) {}
      msg.textContent = 'Opening…';
      open(dir);
    } else {
      msg.className = 'msg bad'; msg.textContent = 'That password isn’t right. Try again.';
      pw.select();
    }
  });
})();
</script>
</body>
